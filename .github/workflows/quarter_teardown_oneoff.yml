name: quarter_teardown_oneoff

# ONE-OFF catch-up: every PF holding that has reported the CURRENT season so far,
# in a single mail grouped by the day its numbers landed.
#
# Dispatch only — there is no schedule and no other trigger, so this file is inert
# until someone runs it deliberately. The recurring 24-hour version lives as a step
# inside t4_nightly.yml.
#
# Selection is on the STATEMENTS, not on filing dates: a company is included only
# once its newest quarterly_pl column IS the season quarter. A filing dated in the
# season whose numbers have not yet landed is skipped and logged, so the mail can
# never render one quarter's figures under another quarter's heading.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the mail but do not send it"
        type: boolean
        default: false
      since_hours:
        description: "Optional window in hours instead of the whole season (blank = whole season)"
        default: ""

concurrency:
  group: quarter-teardown-oneoff
  cancel-in-progress: false

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests beautifulsoup4 lxml python-dotenv \
                      google-api-python-client google-auth google-auth-oauthlib \
                      google-auth-httplib2 xlrd openpyxl

      - name: Self-tests (fail fast before touching mail)
        run: |
          python scripts/provenance.py --self-test
          python scripts/redflag_register.py --self-test
          python scripts/ar_scorecard.py --self-test
          python scripts/deck_teardown.py --self-test

      - name: Quarterly teardown — season catch-up
        run: |
          ARGS="--season-all"
          if [ -n "${{ inputs.since_hours }}" ]; then
            ARGS="--pf --mail --by-day --force --since-hours ${{ inputs.since_hours }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "running: python scripts/quarter_teardown.py $ARGS"
          python scripts/quarter_teardown.py $ARGS

      - name: Upload the mail body and per-company pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarter-teardown-html
          path: |
            quarter_teardown_preview.html
            quarter_teardown_*.html
          if-no-files-found: warn
