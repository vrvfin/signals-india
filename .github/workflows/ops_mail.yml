name: ops_mail

# Ops digest — did everything run, is the data fresh, sample rows from every
# build, open review flags. USER RULE 2026-06-12: all mails arrive in the
# 19:00 IST evening batch.

on:
  schedule:
    - cron: "30 13 * * *"          # 13:30 UTC = 19:00 IST, daily
  workflow_dispatch: {}

permissions:
  actions: read                     # list workflow runs
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Send ops digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO:      ${{ github.repository }}
        run: python scripts/run_ops_mail.py
