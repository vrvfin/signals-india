name: pf_tracker

# Workflow PF — portfolio decision & performance tracker. Pure Drive + price math
# + email (NO Gemini). Runs AFTER the Daily Pipeline (fresh OHLCV + features), so
# forward returns / movers use the day's data. Manual dispatch for on-demand runs.
#
# Reads the newest holdings file from Drive (pf_tracking/ or portfolio/); the user
# uploads only on change. History lives in our own append-only ledger under
# company_repo/_index/pf_tracker/, independent of the Drive holdings file.

on:
  workflow_run:
    workflows: ["Daily Pipeline Execution"]   # daily.yml (16:00 IST, data ready ~17:00)
    types: [completed]
  workflow_dispatch:                          # manual trigger from the GitHub UI
    inputs:
      no_write:
        description: "Preview run — send the mail but write NOTHING to Drive"
        type: boolean
        default: false

concurrency:
  group: pf_tracker
  cancel-in-progress: false                   # never run two passes at once

jobs:
  pf_tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only after a SUCCESSFUL daily pipeline (fresh prices), or any manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
      GMAIL_USER:              ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install openpyxl xlrd            # .xlsx / legacy .xls holdings parse

      # "Daily Pipeline Execution" runs TWICE a day — once from an external
      # repository_dispatch (~10:30 UTC) and once from its own schedule (~11:00 UTC).
      # Both succeed, so this workflow's workflow_run trigger fired twice and mailed
      # twice. Rather than touch the shared daily.yml (its double-run may be
      # deliberate redundancy for the data pipeline), dedupe here: at most one
      # mail per UTC day. A manual dispatch always runs, so previews still work.
      - name: One mail per day
        id: dedupe
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          n=$(gh run list --workflow=pf_tracker.yml --status=success --limit 30 \
                --json createdAt --jq "[.[]|select(.createdAt|startswith(\"$today\"))]|length")
          echo "done_today=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then
            echo "::notice::pf_tracker already succeeded $n time(s) today — skipping to avoid a duplicate mail."
          fi

      # A preview dispatch adds --no-write: the mail goes out, but the snapshot,
      # the decision ledger and every derived table are left untouched. The
      # scheduled workflow_run path never sets it, so nightly behaviour is unchanged.
      - name: Run PF decision tracker
        if: github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.done_today == '0'
        run: |
          python scripts/pf_decision_tracker.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.no_write) && '--no-write' || '' }}
