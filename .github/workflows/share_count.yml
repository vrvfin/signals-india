name: Share Count (weekly)

# Weekly share count for every company in universe/master_list.csv, read from
# Screener's public company page (Market Cap / Current Price). Writes the NEW
# side file universe/share_count.csv. Phase 1 (daily.yml, "Update market cap")
# multiplies it by the day's close to keep universe/market_cap.csv current.
# ~1.4-1.8 s per company -> ~2.5 h for the full universe. Saturday, so it never
# overlaps Phase 1 (weekdays) or the Monday fundamentals sweep on Screener.

on:
  schedule:
    - cron: "30 2 * * 6"     # 02:30 UTC Saturday = 08:00 IST
  workflow_dispatch:

concurrency:
  group: share-count
  cancel-in-progress: false

jobs:
  share-count:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # checkpoints every 200 names; a re-run resumes
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-fund-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-fund-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "yfinance>=1.3.0"

      - name: Write credentials from secrets
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE:         ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      - name: Share count (Screener, full universe)
        run: python scripts/build_share_count.py
