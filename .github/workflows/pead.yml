name: pead

# Phase 3 / T2.5 — daily earnings refresh + PEAD (guidance-vs-actual) + 2 emails.
# Runs on CLOUD data only (Screener company pages, NSE calendar, Drive parquets),
# NO Gemini. Target ~20:00 IST (after close + Screener lag). GitHub cron drifts
# LATE only (observed +3h), so schedule 19:15 IST and let drift land ~20:00.
# t4_nightly chains off this workflow's completion (workflow_run) — guaranteed
# ordering, no second cron to drift.

# USER RULE 2026-06-12: ALL daily mails START at 19:00 IST. This cron anchors
# the evening batch — pead mails first, then t4_nightly chains off completion
# (fraud scan, catalyst, AR digest, PF digest follow in sequence).
# PRIMARY trigger: cron-job.org POSTs a workflow_dispatch at 19:00 IST sharp.
# The GitHub cron below is only a LATE FALLBACK (21:30 IST) — the guard job
# skips it when today's batch already ran, so no duplicate mails.
on:
  schedule:
    - cron: "0 16 * * *"         # fallback only: 16:00 UTC = 21:30 IST
  workflow_dispatch:

concurrency:
  group: pead
  cancel-in-progress: false      # never two refresh passes at once (parquet writes)

jobs:
  guard:
    # once per day: scheduled fallback skips if today already succeeded
    # (workflow_dispatch — cron-job.org or manual — always runs)
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.chk.outputs.go }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            --get --data-urlencode "status=success" \
            --data-urlencode "created=>=${today}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pead.yml/runs" \
            | grep -c '"run_started_at"' || true)
          echo "successful runs today: $n"
          [ "$n" -gt 0 ] && echo "go=false" >> "$GITHUB_OUTPUT" \
                         || echo "go=true" >> "$GITHUB_OUTPUT"

  pead:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install requests beautifulsoup4 lxml pandas pyarrow \
            google-api-python-client google-auth google-auth-oauthlib python-dotenv

      - name: Refresh today's results (Screener /results/latest)
        run: python scripts/scrape_results_table.py
        continue-on-error: true

      - name: Incremental 3-statement refresh (today's reporters)
        run: python scripts/backfill_results_3stmt.py --incremental
        continue-on-error: true

      - name: Compute PEAD flags (guidance vs actual)
        run: python scripts/build_pead_flags.py
        continue-on-error: true

      # >100% PAT/EPS surge flagger — consistent vs one-off (user 2026-07-08).
      # Writes growth_surge.parquet + mails last-24h reporters (toggle 'growth_surge').
      - name: Growth surge flags + mail (last 24h reporters)
        run: python scripts/flag_growth_surge.py
        continue-on-error: true

      - name: Send daily emails (today's match + tomorrow's calendar)
        run: python scripts/run_pead_daily.py --days-ahead 1

      # Third daily email — concall guidance table (last 24h, live Phase 2 only)
      # MERGED with the high-growth flag (user 2026-06-12): 🚀 rows >30% + a
      # GF1-only supplement section. Skips itself when nothing is in window.
      - name: Send guidance digest + high-growth flags (last 24h)
        if: always()    # an earlier email failure must not block this one
        run: python scripts/guidance_digest_email.py
        continue-on-error: true
