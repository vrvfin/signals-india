name: Chart galleries (after Phase 1)

# Builds the chart galleries whose data is all on Drive and publishes them to
# Drive company_repo/_galleries/ (+ manifest.json, per page ok/failed). The local
# bats (gallery_all.bat, pf_gallery.bat) FETCH these pages in seconds instead of
# building them for ~45 min; a page missing/failed here is built locally instead.
#
#   after Phase 1 ("Daily Pipeline Execution")  -> all pages
#   after the guru screen (runs ~23:00 IST)      -> the guru page only
#
# PRIVACY: the repo is public, so this log is public. The PF pages (holdings) are
# built with ALL output suppressed and go to Drive only. There is NO artifact upload.
# PF technical history (local 25y store) and Zanger (local library + images) are built
# by the PC task and published to the same Drive folder (gallery_sync publish --owner pc).
# Plan: .claude/plans/galleries-ci-fetch.md

on:
  workflow_run:
    workflows: ["Daily Pipeline Execution", "Guru screen (daily stock screen + new-stock alert)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: galleries
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GURU_ONLY: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name != 'Daily Pipeline Execution' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Write credentials from secrets
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
          } > .env
          echo "SINCE=$(date +%s)" >> "$GITHUB_ENV"

      # ---- market galleries (same commands + --min-mcap 150 as gallery_all.bat) ----
      - name: Full gallery
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --view full --purge-cache --min-mcap 150 --no-open
      - name: Recent additions
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --view additions --min-mcap 150 --no-open
      - name: Recent drops
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --view drops --min-mcap 150 --no-open
      - name: Recent IPOs
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --view ipo --min-mcap 150 --no-open
      - name: Guidance watchlist gallery
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --mode watchlist --min-mcap 150 --no-open
      - name: New today
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_gallery.py --view new --min-mcap 150 --no-open
      - name: Decision tracker
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: python scripts/build_tracker_html.py --no-open
      - name: Guru screen gallery
        continue-on-error: true
        run: python guru/build_guru_gallery.py --no-open

      # market state: its two deep local inputs (breadth table + pre-2016 macro history)
      # are pushed to Drive by the PC's GalleriesRefresh task; pulled into the same paths
      # the builder reads (builder unchanged — it renders without them, just shallower)
      - name: Market state (inputs from Drive)
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: |
          python scripts/gallery_sync.py inputs-pull
          python scripts/build_market_state_html.py --no-open

      # ---- PF pages: output fully suppressed (public log), result line only ----
      - name: PF galleries (output hidden)
        if: env.GURU_ONLY != 'true'
        continue-on-error: true
        run: |
          rc=0
          for args in "--mode pf --resample D" "--mode pf --resample W" "--mode pf --resample M"; do
            if python scripts/build_gallery.py $args --no-open > /dev/null 2>&1; then
              echo "PF $args: ok"
            else
              echo "PF $args: FAILED (output hidden - run pf_gallery_local.bat to see why)"; rc=1
            fi
          done
          if python scripts/build_sold_gallery.py --no-open > /dev/null 2>&1; then
            echo "sold gallery: ok"
          else
            echo "sold gallery: FAILED (output hidden - run pf_gallery_local.bat to see why)"; rc=1
          fi
          exit $rc

      - name: Publish to Drive
        run: |
          if [ "$GURU_ONLY" = "true" ]; then
            python scripts/gallery_sync.py publish --owner ci --since "$SINCE" --only gallery_guru.html
          else
            python scripts/gallery_sync.py publish --owner ci --since "$SINCE"
          fi
