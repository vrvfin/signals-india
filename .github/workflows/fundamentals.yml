name: Fundamentals Refresh

# Full-universe (NSE + BSE) fundamentals + market cap + statement history via
# Screener. Decoupled from daily.yml because the whole-universe Screener pull
# plus per-company statement parquets takes a few hours — too heavy for the
# daily 180-min budget. Runs weekly (Monday early IST) + manual dispatch.
# Writes fundamentals/summary.parquet, fundamentals/per_symbol/, and
# fundamentals/statements/, plus universe/market_cap.csv. Downstream strategies
# (CANSLIM, PEAD) in daily.yml read the summary this job keeps fresh.

on:
  schedule:
    - cron: "0 1 * * 1"     # 01:00 UTC Monday = 06:30 IST Monday (FULL universe)
    - cron: "30 14 * * *"   # 14:30 UTC daily = 20:00 IST (INCREMENTAL: only
                            # companies whose results hit the feed in the last
                            # 4 days — ~90 names/day in results season, ~0 off-
                            # season, so it exits in seconds most of the year)
  workflow_dispatch:

# Serialize: a new trigger waits for any run still in progress.
concurrency:
  group: fundamentals-refresh
  cancel-in-progress: false

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    # No explicit timeout — defaults to the GitHub-hosted runner 6h cap, ample
    # for the ~3-4h full-universe Screener pull + statement parquets.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-fund-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-fund-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "yfinance>=1.3.0"

      - name: Write credentials from secrets
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE:         ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      # Board-meeting calendar -> results_calendar.parquet. The incremental step
      # below reads it UNIONed with results.parquet, so it must run first.
      # pead.yml persists the same file earlier in the evening; refreshing it
      # here too means this job never depends on that one's ordering.
      - name: Persist results calendar (NSE+BSE board meetings, next 14d)
        run: python scripts/earnings_calendar.py --days-back 1 --days-ahead 14 --persist
        continue-on-error: true

      # Full universe (NSE symbol + BSE bse_code). Writes summary + per_symbol +
      # statements. SCREENER_SESSION_COOKIE is read from .env by the script.
      # Which mode runs depends on which cron fired: the Monday 01:00 slot (and
      # manual dispatch) does the FULL universe; the daily 14:30 slot refreshes
      # only companies whose results appeared in the feed in the last 4 days.
      # GAP-SCAN, not a blind sweep (changed 2026-08-07). Was: fetch all ~5,600
      # companies every Monday, ~290 min. Now: scan coverage first and fetch only
      # companies whose current-quarter numbers are due-or-overdue and not yet
      # stored — measured 177 companies / ~4.5 min mid-season. Companies already
      # current, and those whose board meeting is still ahead, are skipped.
      # Falls back to the full sweep automatically if results_calendar.parquet is
      # missing. Drop --gap-scan to force a true full sweep.
      - name: Fundamentals (gap scan + statements)
        if: github.event.schedule != '30 14 * * *'
        env:
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: python scripts/ingest_fundamentals.py --gap-scan
        continue-on-error: true

      - name: Fundamentals (incremental — recent result declarers)
        if: github.event.schedule == '30 14 * * *'
        env:
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: python scripts/ingest_fundamentals.py --recent-results-days 4
        continue-on-error: true

      - name: Enrich market cap (NSE via yfinance)
        if: github.event.schedule != '30 14 * * *'   # weekly full run only
        run: python scripts/enrich_market_cap.py
        continue-on-error: true
