name: pf_daily_mails

# DAILY, per-company mails for PF holdings: results teardown, investor presentation,
# credit rating — one mail per company per document, not one digest covering everyone.
#
# TRIGGER (user, 2026-08-15): a mail goes out when the holding is in PF **and** its
# results-calendar date has arrived **and** it has not already been mailed for that
# document and period. Deliberately NOT a rolling time window: a window makes a skipped
# run lose that company for good, whereas "not yet mailed" is self-healing — the next
# run picks it up whenever it runs. So a failed morning costs a delay, never a company.
#
# INDEPENDENT OF PHASE 2. Nothing here takes _extract.lock, queues a document, calls
# Gemini or writes company_page.md. It reads the parquets Phase 2 already produces and
# writes one thing of its own: its mail ledger. Phase-2 concall keeps absolute priority
# because this never competes for anything it uses.
#
# Runs after t4_nightly has refreshed statements and the extractors have drained, so the
# numbers a mail quotes are the current ones.

on:
  schedule:
    # 09:05 IST, EVERY day, after the nightly chain. Mon-Sat until 2026-08-16: a deck
    # filed on a Saturday evening or a Sunday then waited until Monday, which is exactly
    # what happened to RISHABH's Q1FY27 deck. Companies file at weekends; the run is
    # cheap and no-ops when nothing is due, so there is no reason to skip a day.
    - cron: "35 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render previews only — send nothing, do not advance the ledger"
        type: boolean
        default: false
      types:
        description: "Which mails to consider"
        default: "results,presentation,rating"
      limit:
        description: "Max mails this run (0 = no cap)"
        default: "0"

concurrency:
  group: pf-daily-mails
  cancel-in-progress: false

jobs:
  mails:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # Fail fast. The trigger logic decides whether a company is ever mailed at all;
      # a regression there is silent by nature — you get no mail, and no error either.
      - name: Self-tests (fail fast)
        run: |
          python scripts/deck_summary.py --self-test
          python scripts/pf_coverage.py --self-test
          python scripts/pf_company_mails.py --self-test
          python scripts/pf_season_status.py --self-test

      # DOCUMENT-TRIGGERED. Sweep first, so a deck or rating that appeared since the
      # last run is discovered, downloaded and extracted BEFORE the mail step decides
      # what is due. Without this the mails could only ever report what some other
      # workflow happened to have ingested already.
      #
      # Screener is primary and already one row per quarter; NSE fills only the quarters
      # Screener has nothing for (and is the ONLY source that reaches the SME holdings,
      # which carry no bse_code). --one-per-quarter keeps this to one document per
      # quarter per type instead of re-ingesting a company's whole history.
      - name: Daily sweep — find new documents
        run: >
          python scripts/pf_docs_sweep.py --enqueue --nse --one-per-quarter
          --days 30 --types presentation,rating,results
        continue-on-error: true

      - name: Fetch what the sweep found
        run: python scripts/pf_docs_sweep.py --hydrate --limit 40
        continue-on-error: true

      # FREE_POOL, never the Phase-2 GEMINI_API_KEY pool — this must not compete with
      # live concall extraction for quota. Bounded so a heavy day cannot run long.
      - name: Extract new decks and ratings (FREE_POOL)
        env:
          FREE_POOL:           ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY: ${{ secrets.BACKFILL_GEMINI_KEY }}
        run: |
          # multi-line secrets (KEY_N=value per line) flatten to one comma-joined line,
          # the same shape backfill_nightly writes.
          {
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
          } >> .env
          # --deck-summary is the standalone read of the deck (18 sections). It runs HERE,
          # at ingest, because retention rule 1 deletes the PDF two days later — measured
          # today: of the 25 most recent decks on Drive, 24 already 404 and only the one
          # filed this morning still downloads. There is no later chance to read the slides.
          python scripts/extract_presentation.py --teardown --deck-summary \
            --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --limit 25 --deadline-min 20 || true
          python scripts/extract_rating.py \
            --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --limit 25 --deadline-min 20 || true
        continue-on-error: true

      # Per-company presentation and rating mails.
      - name: Per-company mails (presentation, rating)
        run: >
          python scripts/pf_company_mails.py
          --types "${{ inputs.types || 'presentation,rating' }}"
          --limit "${{ inputs.limit || '0' }}"
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      # The results teardown keeps its own renderer — one mail per reporting company,
      # covering the last 26 hours so a late-evening filing is never straddled by the
      # 24-hour boundary.
      # --per-company: one mail per reporting company, matching the presentation and
      # rating mails above. The combined body hit 90,957 B on a 42-company catch-up,
      # past Gmail's clip threshold; splitting removes the size ceiling entirely.
      - name: Results teardown mails (per company, last 26h)
        run: >
          python scripts/quarter_teardown.py --per-company --since-hours 26
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      # The completeness signal. Individual company mails say what arrived; only this
      # one can say what did NOT - every holding, every document type, with a reason.
      - name: Season status (delivered / due / awaiting / no information)
        if: always()
        run: >
          python scripts/pf_season_status.py
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      - name: Upload previews (dry-run inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-daily-mail-previews
          path: |
            mail_*.html
            quarter_teardown_preview.html
          if-no-files-found: ignore
