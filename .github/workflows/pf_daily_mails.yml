name: pf_daily_mails

# DAILY, per-company mails for PF holdings: results teardown, investor presentation,
# credit rating — one mail per company per document, not one digest covering everyone.
#
# TRIGGER (user, 2026-08-15): a mail goes out when the holding is in PF **and** its
# results-calendar date has arrived **and** it has not already been mailed for that
# document and period. Deliberately NOT a rolling time window: a window makes a skipped
# run lose that company for good, whereas "not yet mailed" is self-healing — the next
# run picks it up whenever it runs. So a failed morning costs a delay, never a company.
#
# WHAT USES AN LLM HERE, AND WHAT DOES NOT. The mail steps make NO model calls at all:
# they read the parquets and the company_page.md sections Phase 2 already wrote, render
# them, and write one thing of their own - the mail ledger. Every summary a reader sees
# is Phase 2's own extraction output; no prompt and no summarisation lives in this
# workflow. The ONLY model calls are Phase 2's OWN extractors invoked below
# (presentation, rating, annual report), on Phase 2's prompts and the FREE_POOL keys,
# each capped and deadline-bounded.
#
# PHASE-2 CONCALL KEEPS ABSOLUTE PRIORITY. extract_concall.py is never run here. The
# sweep only enqueues concall rows (source=pf_sweep) and phase2.yml drains them on its
# next scheduled pass, so the P0 path is untouched. The extractors that DO run here take
# _extract.lock with defer_to_phase2=True.

on:
  schedule:
    # EVERY 3 HOURS across the filing day (user, 2026-09-02) - 09:05, 12:05, 15:05,
    # 18:05 and 21:05 IST. A document filed at noon used to wait until the next morning;
    # this bounds that to about three hours. Nothing outside the window, because Indian
    # exchange filings land roughly 09:00-23:00 IST and an overnight run would only
    # re-scan an unchanged book.
    #
    # EVERY day, including weekends. Mon-Sat until 2026-08-16: a deck filed on a Saturday
    # evening or a Sunday then waited until Monday, which is exactly what happened to
    # RISHABH's Q1FY27 deck. Companies file at weekends; a run no-ops when nothing is
    # due, so there is no reason to skip a day.
    #
    # The concurrency group below serialises these, and every trigger is idempotent: the
    # sweep skips documents already queued and the mail skips documents already sent.
    - cron: "35 3,6,9,12,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render previews only — send nothing, do not advance the ledger"
        type: boolean
        default: false
      types:
        description: "Which mails to consider"
        default: "results,presentation,rating,concall,annual_report"
      scope:
        description: "concall/AR scope: 'current' (this quarter + this FY) or 'all'"
        default: "current"
      limit:
        description: "Max mails this run (0 = no cap)"
        default: "0"

concurrency:
  group: pf-daily-mails
  cancel-in-progress: false

jobs:
  mails:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # Fail fast. The trigger logic decides whether a company is ever mailed at all;
      # a regression there is silent by nature — you get no mail, and no error either.
      - name: Self-tests (fail fast)
        run: |
          python scripts/deck_summary.py --self-test
          python scripts/pf_coverage.py --self-test
          python scripts/pf_company_mails.py --self-test
          python scripts/pf_season_status.py --self-test

      # DOCUMENT-TRIGGERED. Sweep first, so a deck or rating that appeared since the
      # last run is discovered, downloaded and extracted BEFORE the mail step decides
      # what is due. Without this the mails could only ever report what some other
      # workflow happened to have ingested already.
      #
      # Screener is primary and already one row per quarter; NSE fills only the quarters
      # Screener has nothing for (and is the ONLY source that reaches the SME holdings,
      # which carry no bse_code). --one-per-quarter keeps this to one document per
      # quarter per type instead of re-ingesting a company's whole history.
      #
      # annual_report and concall were NOT swept before, and nothing else reliably found
      # them for a holding: ingest_announcements EXCLUDES both by design ("Phase 2 owns
      # these"), and the Screener feed Phase 2 does use is a 25-item market-wide page-1
      # window that a PF filing rolls off during AR season. Concall is safe to sweep now
      # that the sweep drops recordings — Screener's bare "REC" link is audio, and
      # queueing audio into a PDF extractor is the largest single class of extract error.
      # THREE SOURCES, each reaching what the others cannot. Screener is primary and
      # cleanest; NSE is the only one that reaches the SME holdings (no bse_code); BSE
      # reaches a mainboard filing at its origin, on the day it is made. NSE and BSE
      # fill gaps only, so a filing is never enqueued twice.
      - name: Daily sweep — find new documents (screener + nse + bse)
        run: >
          python scripts/pf_docs_sweep.py --enqueue --nse --bse --one-per-quarter
          --days 30 --types presentation,rating,results,annual_report,concall
        continue-on-error: true

      - name: Fetch what the sweep found
        run: python scripts/pf_docs_sweep.py --hydrate --limit 40
        continue-on-error: true

      # FREE_POOL, never the Phase-2 GEMINI_API_KEY pool — this must not compete with
      # live concall extraction for quota. Bounded so a heavy day cannot run long.
      - name: Extract new decks, ratings and annual reports (FREE_POOL)
        env:
          FREE_POOL:           ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY: ${{ secrets.BACKFILL_GEMINI_KEY }}
        run: |
          # multi-line secrets (KEY_N=value per line) flatten to one comma-joined line,
          # the same shape backfill_nightly writes.
          {
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
          } >> .env
          # --deck-summary is the standalone read of the deck (18 sections). It runs HERE,
          # at ingest, because retention rule 1 deletes the PDF two days later — measured
          # today: of the 25 most recent decks on Drive, 24 already 404 and only the one
          # filed this morning still downloads. There is no later chance to read the slides.
          python scripts/extract_presentation.py --teardown --deck-summary \
            --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --limit 25 --deadline-min 20 || true
          python scripts/extract_rating.py \
            --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --limit 25 --deadline-min 20 || true
          # Annual reports are the slowest documents here (map-reduce over a 10 MB+ PDF),
          # so the cap is lower than the others. Whatever is not drained now stays pending
          # and phase2 / backfill_nightly picks it up; the mail is self-healing and
          # reports it the next morning. CONCALL is deliberately NOT extracted here - that
          # path is P0 and belongs to Phase 2, whose live step already drains the swept
          # rows (source=pf_sweep) on its next scheduled pass.
          python scripts/extract_annual_report.py \
            --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --limit 10 --deadline-min 20 || true
        continue-on-error: true

      # Per-company mails: one mail per company per DOCUMENT.
      # concall and annual_report carry the narrative Phase 2 wrote to company_page.md
      # (no parquet holds that prose). Each is scoped to its own calendar: a concall to
      # the SEASON QUARTER, exactly as the presentation mail above; an annual report to
      # the FINANCIAL YEAR, because the AGM timetable spreads one FY's reports across
      # Jun-Sep and a narrower window would split the crop arbitrarily.
      # A holding that entered the portfolio in the last 30 days bypasses both and is
      # onboarded with its LATEST call and report - the same way a new holding picks up
      # the current quarter's deck simply by having no ledger row yet.
      - name: Per-company mails (presentation, rating, concall, annual report)
        run: >
          python scripts/pf_company_mails.py
          --types "${{ inputs.types || 'presentation,rating,concall,annual_report' }}"
          --scope "${{ inputs.scope || 'current' }}"
          --limit "${{ inputs.limit || '0' }}"
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      # The results teardown keeps its own renderer — one mail per reporting company,
      # covering the last 26 hours so a late-evening filing is never straddled by the
      # 24-hour boundary.
      # --per-company: one mail per reporting company, matching the presentation and
      # rating mails above. The combined body hit 90,957 B on a 42-company catch-up,
      # past Gmail's clip threshold; splitting removes the size ceiling entirely.
      - name: Results teardown mails (per company, last 26h)
        run: >
          python scripts/quarter_teardown.py --per-company --since-hours 26
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      # The completeness signal. Individual company mails say what arrived; only this
      # one can say what did NOT - every holding, every document type, with a reason.
      - name: Season status (delivered / due / awaiting / no information)
        if: always()
        run: >
          python scripts/pf_season_status.py
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
        continue-on-error: true

      - name: Upload previews (dry-run inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pf-daily-mail-previews
          path: |
            mail_*.html
            quarter_teardown_preview.html
          if-no-files-found: ignore
