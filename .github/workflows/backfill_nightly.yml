name: backfill-nightly

# Phase 3 T1+T2 production backfill.
#
# STORAGE POLICY (mirrors Phase 2 exactly):
#   Raw PDFs are transient — kept for extraction only, deleted after 2 days.
#   cleanup_company_docs.py (RETAIN_DAYS=2) runs as the LAST step every night.
#   The fetch cap (max_fetch default 500) ensures PDFs uploaded tonight are always
#   fully extracted tonight — nothing sits unprocessed past 2 days.
#   Math: 500 companies × 4 concalls = 2,000 PDFs/night << ~3,400 extract
#   capacity/night (8 keys × CI timeout bound). Safe headroom. Adjust max_fetch
#   higher only if you have more keys / longer CI budget.
#
# NIGHTLY (two crons — backfill owns 23:00–08:30 IST; Phase 2 first slot is 09:00 IST):
#   Run 1  23:00 IST (17:30 UTC): fetch ~110 companies + extract until job timeout
#          (340 min → ends 04:40 IST worst case; saves are per-doc, ≤1 doc lost on kill).
#   Run 2  04:45 IST (23:15 UTC): extract only, --deadline-min capped to end by
#          08:25 IST — BEFORE Phase 2's first cron fires (09:00 IST; 35-min buffer;
#          the _extract.lock is the safety net if anything still overlaps).
#   Both: T2 incremental + cleanup. Cleanup is queue-aware (pending PDFs exempt).
#
# CAPACITY (measured 2026-06-09, see PROJECT_STATUS):
#   ~50 premium calls/day/PROJECT (~20+15+20 across the 3 models), NOT per key —
#   plus lite-model quota (unmeasured). Runtime is the other cap: ~75 s/concall →
#   ~270/run-1 + ~180/run-2 ≈ ~450/night when quota allows.
#   Fetch is sized to match: 110 companies ≈ 440 PDFs ≈ one night's extract.
#   Tune max_fetch after the first 7–8-key night shows real quota throughput.
#
# FETCH (scheduled run 1 automatically; manual dispatch via do_fetch=true):
#   Queues new concalls for the next N companies in priority order, then the
#   SAME run extracts them immediately (pull → summarise in one go).
#   Fetch is idempotent — already-queued docs are skipped.
#   Priority: portfolio ~56 → conviction ~498 → market-cap tail.

# CATCH-UP MODE (user 2026-06-12, until ~2026-07-02): every 4 hours around the
# clock to chew through the ~2,400-company tail in days. Each slot fetches a
# small slice and extracts it immediately — no PDF lies around. Quota resets
# ~13:30 IST, so the day slots tap a second quota-day. Daytime collisions with
# Phase 2 are serialized by _extract.lock (live extraction skips a slot at
# worst). AFTER THE TAIL IS DONE: drop back to the night-only slots
# (30 17 / 30 19 / 30 21 / 30 23 / 0 1).
on:
  schedule:
    - cron: '30 1,5,9,13,17,21 * * *'   # every 4h: 07:00/11:00/15:00/19:00/23:00/03:00 IST
  # External reliability backstop (cron-job.org → GitHub dispatches API). The
  # seasonal gate (backfill_skip_check.py) still applies to dispatched runs — only
  # manual workflow_dispatch bypasses it.
  repository_dispatch:
    types: [trigger-backfill]
  workflow_dispatch:
    inputs:
      do_fetch:
        description: "T1: queue new concalls from Screener/BSE for next N companies"
        type: boolean
        default: false
      max_fetch:
        description: "Companies to fetch per slot (scheduled default: 150; queue capped at --target-pending)"
        default: "150"
      do_t2_full:
        description: "T2: full 3-statement scrape (not just today's reporters)"
        type: boolean
        default: false
      max_t2:
        description: "Max companies for T2 full scrape (0 = all)"
        default: "0"

concurrency:
  group: backfill-nightly
  cancel-in-progress: false          # queue rather than cancel

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340             # ~5h40m; GitHub cap is 360min per job
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── SEASONAL GATE — Phase 2 is priority in earnings season ──────────────
      # Peak season Mon–Sat: backfill runs ONLY in the night window [22:30, 09:30
      # IST]; daytime slots skip so Phase 2 owns the lock. Sunday + off-season:
      # all slots. The morning run is deadline-capped to release the lock by 09:30
      # (30 min before Phase 2's 10:00 peak start). Pure stdlib — runs before deps.
      - name: Seasonal skip-check
        id: sched
        run: python scripts/backfill_skip_check.py

      - name: Write credentials (.env)
        if: steps.sched.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          FREE_POOL:               ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
          BACKFILL_GEMINI_KEY_1:   ${{ secrets.BACKFILL_GEMINI_KEY_1 }}
          BACKFILL_GEMINI_KEY_2:   ${{ secrets.BACKFILL_GEMINI_KEY_2 }}
          BACKFILL_GEMINI_KEY_3:   ${{ secrets.BACKFILL_GEMINI_KEY_3 }}
          BACKFILL_GEMINI_KEY_4:   ${{ secrets.BACKFILL_GEMINI_KEY_4 }}
          BACKFILL_GEMINI_KEY_5:   ${{ secrets.BACKFILL_GEMINI_KEY_5 }}
          BACKFILL_GEMINI_KEY_6:   ${{ secrets.BACKFILL_GEMINI_KEY_6 }}
          BACKFILL_GEMINI_KEY_7:   ${{ secrets.BACKFILL_GEMINI_KEY_7 }}
          BACKFILL_GEMINI_KEY_8:   ${{ secrets.BACKFILL_GEMINI_KEY_8 }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            # Secret may be a multi-line blob (KEY_N=value lines or bare keys):
            # flatten to one comma-joined line so dotenv keeps every key.
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY_1=$BACKFILL_GEMINI_KEY_1"
            echo "BACKFILL_GEMINI_KEY_2=$BACKFILL_GEMINI_KEY_2"
            echo "BACKFILL_GEMINI_KEY_3=$BACKFILL_GEMINI_KEY_3"
            echo "BACKFILL_GEMINI_KEY_4=$BACKFILL_GEMINI_KEY_4"
            echo "BACKFILL_GEMINI_KEY_5=$BACKFILL_GEMINI_KEY_5"
            echo "BACKFILL_GEMINI_KEY_6=$BACKFILL_GEMINI_KEY_6"
            echo "BACKFILL_GEMINI_KEY_7=$BACKFILL_GEMINI_KEY_7"
            echo "BACKFILL_GEMINI_KEY_8=$BACKFILL_GEMINI_KEY_8"
          } > .env

      - name: Install deps
        if: steps.sched.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install google-genai requests beautifulsoup4 lxml pandas pyarrow \
            google-api-python-client google-auth google-auth-oauthlib python-dotenv PyMuPDF

      - name: Verify BACKFILL key pool
        if: steps.sched.outputs.skip != 'true'
        run: python scripts/extract_concall.py --backfill --check-keys

      # ── T1 FETCH (scheduled run 1 + manual dispatch) ────────────────────────
      # Sized to nightly extract capacity (~110 cos ≈ 440 PDFs ≈ ~450 extracts/night)
      # so no PDF waits unprocessed past the 2-day retention. Run 2 (early morning,
      # UTC hour >= 20) skips fetch — its short window only drains the queue.
      # NEVER pass 0 — always cap to stay within 2-day storage policy.
      # Every slot fetches a SMALL slice and extracts it immediately — sized so
      # each slot's pull is digested within the slot (user 2026-06-12: no PDF
      # lies around; hard 2-day retention has no pending exemption any more).
      # T12: cursor-free, coverage-driven. No --start. --max-companies is the FETCH
      # budget (covered companies self-skip via backfill_coverage.parquet, so each
      # slot walks forward into the tail naturally). --quarters 8 = last ~2 years of
      # concalls. AR is enabled later by adding a `--types annual_report --years N`
      # step once concall reaches ~100% of the concall-bearing universe.
      # --target-pending 300 = fill-to-target throttle: top the queue up to ~300
      # pending concall docs (≈ measured extract ceiling ~300-600/quota-day, well
      # within the 2-day PDF retention), so extract is never starved AND PDFs never
      # age out before summarising. --max-companies 150 caps companies fetched per
      # slot; the walk stops early if the queue hits target-pending first, so the
      # depth cap — not the company cap — is the real safety limit against
      # over-fetching the deep tail (uncovered companies yield up to 8 concalls each).
      - name: T1 — fetch concalls from Screener/BSE (cursor-free walk)
        if: ${{ steps.sched.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.do_fetch == 'true') }}
        run: |
          MAX=${{ github.event.inputs.max_fetch || '150' }}
          python scripts/run_backfill.py --types concall --quarters 8 \
            --max-companies "$MAX" --target-pending 300

      # ── T1 EXTRACT (every run — drain queue until quota/deadline) ───────────
      # Deadline comes from the seasonal gate: 200 min normally, but the peak
      # Mon–Sat MORNING run is capped so the _extract.lock is released by 09:30 IST
      # — 30 min before Phase 2's 10:00 peak start. Phase 2 thus always wins.
      - name: T1 — extract concalls via Gemini (BACKFILL pool; runs until quota done)
        if: steps.sched.outputs.skip != 'true'
        run: |
          DEADLINE_MIN=${{ steps.sched.outputs.deadline_min }}
          echo "Extract deadline: $DEADLINE_MIN min (from seasonal gate)"
          # HOTFIX 2026-06-16: reverted to sequential (--workers 1). The parallel
          # path (T12 #1, --workers 8) SEGFAULTS in CI (core dumped after ~1 doc) —
          # 3/6 recent runs crashed, processing ~0 docs/24h. Root cause: a C-ext
          # (genai/grpc or pyarrow) is not thread-safe under concurrent calls in the
          # CI image. Sequential is the proven path; re-enable parallel only after
          # the segfault is fixed + re-validated in CI.
          python scripts/extract_concall.py --backfill --deadline-min "$DEADLINE_MIN" || true
          # "|| true" so the job doesn't fail on AllBucketsExhausted (expected exit).

      # ── Stage 2: fetch fresh Annual Reports (3y, universe, newest-first) ─────
      # Only on full night slots (run_extras) so the ARs fetched here are extracted
      # by the T8 step the SAME slot — big AR PDFs must not age out (2-day retention).
      # --target-pending 300 paces fetch to extract capacity (newest FY first).
      - name: T1b — fetch annual reports from Screener (3y universe)
        if: ${{ steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.do_fetch == 'true') }}
        run: |
          python scripts/run_backfill.py --types annual_report --years 3 \
            --max-companies 100 --target-pending 300

      # ── T8 — fresh Annual Reports: summarise ALL (not just PF), then judge ──
      # max-age guard keeps quota off stale legacy rows. Stage 2: FREE_POOL+BACKFILL
      # pool (28 keys, independent of Phase 2) + newest-first + FY-grain supersede.
      # run_extras=false on the short morning run so these extra lock-holders
      # don't overrun the 09:30 cutoff — they run on the full night slots.
      - name: T8 — extract fresh ARs (all companies, FREE_POOL+BACKFILL pool)
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: >
          python scripts/extract_annual_report.py --all-companies
          --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --max-age-hours 48
          --deadline-min 60 || true

      # ── Stage 3: fetch + extract credit ratings universe-wide (CARE/CRISIL/ICRA).
      # Ratings are small/fast; --target-pending 100 paces fetch to the same-slot
      # extract so PDFs don't age out. ICRA rationale links resolve to their PDF.
      - name: T1c — fetch credit ratings from Screener (3y universe)
        if: ${{ steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || github.event.inputs.do_fetch == 'true') }}
        run: |
          python scripts/run_backfill.py --types rating --years 3 \
            --max-companies 100 --target-pending 100

      - name: T8b — extract fresh ratings (all companies, FREE_POOL+BACKFILL pool)
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: >
          python scripts/extract_rating.py --all-companies
          --key-prefix FREE_POOL,BACKFILL_GEMINI_KEY --max-age-hours 48
          --deadline-min 30 || true

      - name: T8 — daily AR digest + focus/defocus lists
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: python scripts/daily_ar_summary.py || true

      # ── T9 — classification refresh (NSE macro-sector + segment seed always;
      # Gemini fills the tail 300/slot, stalest-first, respects locked rows) ──
      - name: T9 — company classification (peer/sector/segment/industry)
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: >
          python scripts/build_classification.py --with-gemini --limit 300
          || true

      # ── T2 FULL SCRAPE (manual only — initial setup or quarterly refresh) ────
      - name: T2 — full 3-statement scrape (all companies)
        if: ${{ steps.sched.outputs.skip != 'true' && github.event.inputs.do_t2_full == 'true' }}
        run: |
          MAX=${{ github.event.inputs.max_t2 || '0' }}
          if [ "$MAX" -gt 0 ]; then
            python scripts/backfill_results_3stmt.py --max-companies "$MAX"
          else
            python scripts/backfill_results_3stmt.py
          fi

      # ── T2 INCREMENTAL (every run — refresh today's reporters) ──────────────
      - name: T2 — refresh financials for today's reporters (incremental)
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: python scripts/backfill_results_3stmt.py --incremental

      # ── T2 DERIVED (every run — recomputes from latest 3stmt) ───────────────
      - name: T2 — derived metrics
        if: steps.sched.outputs.skip != 'true' && steps.sched.outputs.run_extras == 'true'
        run: python scripts/build_derived_metrics.py

      # ── CLEANUP (every run — mirrors Phase 2 exactly) ───────────────────────
      # Delete raw PDFs older than 2 days. Runs LAST so tonight's processed docs
      # are cleaned up on the next run (they'll be 24h old then, cleaned at 48h).
      # Same script, same retention, same policy as Phase 2's cleanup step.
      - name: Cleanup raw PDFs older than 2 days
        # Run on any non-skipped slot even if an earlier step failed; but not on a
        # seasonally-skipped slot (nothing was fetched/extracted there).
        if: always() && steps.sched.outputs.skip != 'true'
        run: python scripts/cleanup_company_docs.py
        continue-on-error: true

      # NOTE: PEAD flags + emails are handled by pead.yml at 20:00 IST (the right
      # post-market-close window). No email step here — avoid duplicate sends.
