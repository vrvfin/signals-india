name: isin_registry

# Keeps a dated copy of the exchange's own ticker->ISIN list and compares it with
# yesterday's. A company's ISIN can change while its ticker stays the same; without
# a dated copy there is nothing to compare against and the change is invisible until
# a company's history has already split in two.
#
# RECORDS ONLY. No existing table, ledger or folder is modified by this workflow.
# Deliberately separate from universe_refresh.yml, which also runs a full 2-year BSE
# OHLCV backfill and so cannot cheaply be made daily.

on:
  schedule:
    - cron: '45 1 * * *'        # 01:45 UTC = 07:15 IST, before the market opens
  workflow_dispatch:

concurrency:
  group: isin_registry
  cancel-in-progress: false

jobs:
  isin_registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
      GMAIL_USER:              ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Write credentials
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Snapshot the exchange list, then compare with yesterday
        run: python scripts/isin_registry.py --snapshot --detect --mail
