name: Phase 2 — Company Intelligence

# ── Schedule design ────────────────────────────────────────────────────────
# PROBLEM: GitHub Actions scheduled jobs are queued, not guaranteed.
# Delays of 30–90 min are common; a slot may fire late or be skipped entirely
# during high-load periods. This is a GitHub platform limitation.
#
# THREE-LAYER RELIABILITY STRATEGY:
#   Layer 1 (this file)  — denser cron schedule (every 2h, 47×/week).
#                          More opportunities = less chance of a long gap.
#   Layer 2 (daily.yml)  — Phase 1 triggers Phase 2 via workflow_dispatch
#                          (ACTIONS_PAT secret) at the end of every daily run.
#                          Guarantees at minimum one execution per business day.
#   Layer 3 (optional)   — External cron via cron-job.org every 2h calling
#                          the GitHub API. Not required but maximises uptime.
#                          See scripts/Concall_Extractor.txt › InfraFix 3.
#
# Weekday (Mon–Fri IST): 7 daytime runs every 2h (10/12/14/16/18/20/22)
#                        + 1 overnight at 03:00 IST  →  8 runs/day
# Saturday (IST):        5 runs (10/12/14/16/18)
# Sunday (IST):          2 runs (10/14)
# Total:                 47 runs/week
#
# skip_check (PHASE2_SKIP_MINUTES=45) prevents redundant back-to-back runs
# when the queue is empty — extra slots cost only ~10 sec when idle.
#
# UTC offsets (IST = UTC+5:30):
#   10 IST = 04:30 UTC | 12 IST = 06:30 | 14 IST = 08:30 | 16 IST = 10:30
#   18 IST = 12:30 UTC | 20 IST = 14:30 | 22 IST = 16:30 | 03 IST = 21:30 UTC (prev day)

on:
  schedule:
    # Mon–Fri daytime: every 2h from 10:00 to 22:00 IST
    - cron: '30 4,6,8,10,12,14,16 * * 1-5'   # IST 10/12/14/16/18/20/22
    # Mon–Fri overnight: 03:00 IST (= 21:30 UTC on Sun–Thu)
    - cron: '30 21 * * 0-4'
    # Saturday: 10/12/14/16/18 IST
    - cron: '30 4,6,8,10,12 * * 6'
    # Sunday: 10/14 IST
    - cron: '30 4,8 * * 0'
  workflow_dispatch:            # manual trigger any time (bypasses skip check)
  repository_dispatch:
    types: [trigger-phase2]     # triggered by daily.yml via ACTIONS_PAT

concurrency:
  group: phase2-pipeline
  cancel-in-progress: false     # queue next run; never kill an active processing job

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # concalls are universal — all must complete; peak season can take 60-90m

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── Skip check ── reads Drive phase2_latest.json; sets skip=true if queue
      # is empty AND last run was < 45 min ago. Prevents redundant back-to-back
      # runs when multiple cron slots fire in quick succession or Phase 1 backup
      # trigger fires while a run just finished. Bypassed on manual trigger.
      # Fail-safe: Drive unreachable → skip=false (always proceed).
      - name: Skip check
        id: fresh
        if: github.event_name != 'workflow_dispatch'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/pipeline_skip_check.py --pipeline phase2

      - name: Write credentials
        if: steps.fresh.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
          } > .env

      # Stage A: scrape new PDFs from Screener into Drive queue
      - name: Ingest company docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_company_docs.py
        continue-on-error: true

      # Stage B: Screener HTML results table (no LLM — structured numbers)
      - name: Scrape results table
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/scrape_results_table.py
        continue-on-error: true

      # Stage B: process pending docs through Gemini (priority order)
      # Concall: universal — all companies, no portfolio filter, no time limit
      - name: Extract concalls
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_concall.py
        continue-on-error: true

      # Results / rating / presentation / annual_report: portfolio-filtered
      - name: Extract results PDFs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_results.py
        continue-on-error: true

      - name: Extract credit ratings
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_rating.py
        continue-on-error: true

      - name: Extract investor presentations
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_presentation.py
        continue-on-error: true

      - name: Extract annual reports
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_annual_report.py
        continue-on-error: true

      # Housekeeping: delete raw PDFs > 10d (daily digests kept forever)
      - name: Cleanup old docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/cleanup_company_docs.py
        continue-on-error: true

      # Status snapshot — writes logs/health/phase2_latest.json for dashboard
      - name: Write Phase 2 status
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/write_phase2_status.py
        continue-on-error: true
