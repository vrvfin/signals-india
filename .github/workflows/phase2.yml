name: Phase 2 — Company Intelligence

# ── Seasonal run strategy ──────────────────────────────────────────────────
#
# India Q-end results seasons (heavy concall upload periods) — see seasons.py:
#   Q3 FY:  15 Jan – 1 Mar    |  Q4 FY: 15 Apr – 14 Jun (60-day annual season)
#   Q1 FY:  15 Jul – 29 Aug   |  Q2 FY: 15 Oct – 29 Nov
#
# This file carries the PEAK schedule (maximum slots).
# pipeline_skip_check.py reads today's date and suppresses extra runs in
# off-season, leaving only 3 runs/day near IST 09:00 / 14:00 / 20:00.
#
# Effective run counts (skip_check enforced):
#   Peak weekday  : every 2h 10:00–22:00 IST (10/12/14/16/18/20/22)      = 7/day
#   Peak Saturday : light (11:30 / 16:30 IST + base 09/14/20)            = ~5/day
#   Peak Sunday   : 3 daytime (09/14/20 IST)                             = 3/day
#   Off-season    : 3/day on ALL day types (skip_check window filter)
#
# Three-layer reliability (see InfraFix 3 in Concall_Extractor.txt):
#   1. This dense cron schedule
#   2. daily.yml backup trigger after Phase 1 (ACTIONS_PAT secret)
#   3. Optional: cron-job.org external HTTP trigger every 2h
#
# UTC offsets (IST = UTC+5:30):
#   03 IST = 21:30 UTC (prev day)   08 IST = 02:30   11 IST = 05:30
#   11:30 IST = 06:00               14 IST = 08:30   16:30 IST = 11:00
#   17 IST = 11:30                  20 IST = 14:30   22 IST = 16:30

on:
  schedule:
    # ── Base slots (all days, year-round) — serve as off-season pattern ──
    # IST 09:00 / 14:00 / 20:00  (UTC 03:30 / 08:30 / 14:30)
    # First slot moved 08:00 → 09:00 (2026-06-10) so backfill owns 23:00–08:30 IST.
    - cron: '30 3,8,14 * * *'

    # ── Weekday peak: every 2h 10:00–22:00 IST (Mon–Fri) ──
    # IST 10/12/14/16/18/20/22  (UTC 04:30/06:30/08:30/10:30/12:30/14:30/16:30)
    # In off-season skip_check collapses these back to the 09/14/20 windows.
    - cron: '30 4,6,8,10,12,14,16 * * 1-5'

    # ── Saturday peak extras ──
    # Adds IST 11:30 / 16:30  (UTC 06:00 / 11:00)
    - cron: '0 6,11 * * 6'

    # ── Overnight 03:00 IST slot REMOVED (2026-06-10) ──
    # The 23:00 → 06:40 IST window now belongs to backfill_nightly.yml.
    # Off-season this slot always self-skipped anyway (outside the 08/14/20
    # IST windows — verified in run logs); in-season late-night backlog now
    # waits for the 08:00 IST run. Re-add '30 21 * * 0-5' after the Phase 3
    # backfill completes if earnings-season backlogs need the overnight drain.

  workflow_dispatch:          # manual trigger (bypasses skip check)
  repository_dispatch:
    types: [trigger-phase2]   # triggered by daily.yml via ACTIONS_PAT

concurrency:
  group: phase2-pipeline
  cancel-in-progress: false   # queue next run; never kill an active processing job

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # peak season can take 60-90 min; must not timeout
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 deprecated Jun 2 2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── Skip check ──────────────────────────────────────────────────────
      # Peak season   : skip if queue empty AND last run < 45 min ago
      # Off-season    : skip if outside IST 08/14/20 ±75 min windows;
      #                 within windows, skip if queue empty AND age < 90 min
      # workflow_dispatch: always bypasses (manual trigger forces run)
      # Fail-safe: Drive unreachable → proceed
      - name: Skip check
        id: fresh
        if: github.event_name != 'workflow_dispatch'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/pipeline_skip_check.py --pipeline phase2

      - name: Write credentials
        if: steps.fresh.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
          } > .env
          # Backfill keys as BACKUP for Phase 2 (user 2026-06-12): appended as
          # numbered GEMINI_API_KEY_9xx so load_api_keys() picks them up AFTER
          # the primary pool. Blob may be bare keys or KEY=VALUE lines.
          i=900
          printf '%s\n' "$BACKFILL_GEMINI_KEY" | while IFS= read -r line; do
            line="${line##*=}"
            line=$(printf '%s' "$line" | tr -d '\r' | xargs)
            [ -z "$line" ] && continue
            i=$((i+1))
            echo "GEMINI_API_KEY_$i=$line" >> .env
          done

      # ── Phase-2 priority beacon (T12) ───────────────────────────────────
      # Raise it before any processing so a concurrently-running backfill steps
      # aside from the shared _extract.lock for this whole job; cleared at the end.
      - name: Raise Phase 2 priority beacon
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/phase2_beacon.py set
        continue-on-error: true

      - name: Ingest company docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_company_docs.py
        continue-on-error: true

      - name: Scrape results table
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/scrape_results_table.py
        continue-on-error: true

      - name: Extract concalls
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_concall.py
        continue-on-error: true

      - name: Extract results PDFs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_results.py
        continue-on-error: true

      - name: Extract credit ratings
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_rating.py
        continue-on-error: true

      - name: Extract investor presentations
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_presentation.py
        continue-on-error: true

      - name: Extract annual reports
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_annual_report.py
        continue-on-error: true

      - name: Cleanup old docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/cleanup_company_docs.py
        continue-on-error: true

      - name: Write Phase 2 status
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/write_phase2_status.py
        continue-on-error: true

      # ── Lower the Phase-2 priority beacon (T12) ─────────────────────────
      # always() so the beacon is cleared even if a step above failed — but not
      # on a skipped run (it never raised the beacon). Without this it would go
      # stale on its own in ~20 min; clearing it lets backfill resume immediately.
      - name: Lower Phase 2 priority beacon
        if: always() && steps.fresh.outputs.skip != 'true'
        run: python scripts/phase2_beacon.py clear
        continue-on-error: true

      # ── Chain backfill into the idle gap (T12) ──────────────────────────
      # Phase 2 just finished and cleared its beacon. Fire a backfill run NOW so
      # the lock is used in the window before the NEXT Phase 2 raises the beacon
      # again — backfill self-paces off Phase 2 instead of guessing with crons.
      # Phase 2 stays strictly priority: the next Phase 2 raises the beacon and
      # this backfill yields within ~75s.
      # Uses repository_dispatch (NOT workflow_dispatch) so the seasonal gate
      # still applies (peak-season daytime self-skips) AND the fetch step runs.
      # Requires ACTIONS_PAT (workflow scope); safe no-op if the secret is unset.
      # Runs even on a skipped Phase 2 slot so idle gaps are still filled.
      - name: Chain backfill into the idle gap
        if: always()
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh api "repos/${{ github.repository }}/dispatches" \
              -f event_type=trigger-backfill \
              && echo "Backfill chained (trigger-backfill dispatched)." \
              || echo "Backfill chain dispatch failed (scheduled crons still cover it)."
          else
            echo "ACTIONS_PAT not set — backfill chain skipped."
          fi
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
