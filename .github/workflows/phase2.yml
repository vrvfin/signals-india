name: Phase 2 — Company Intelligence

# Weekday schedule (Mon–Fri): 5 runs/day  → 25 runs/week
#   Daytime every 3h: 10:00 / 13:00 / 16:00 / 19:00 IST
#   Overnight once:   02:00 IST
# Saturday: 3 runs — 10:00 / 13:00 / 16:00 IST (no overnight)
# Sunday:   1 run  — 13:00 IST only
# Total: 29 runs/week
#
# On self-hosted runner: runs execute on your machine; consume 0 GitHub minutes.
# When machine is off, jobs queue up; smart skip check prevents redundant runs
# when multiple slots fire in a row after machine turns on.
#
# Concurrency group prevents two runs processing the same queue rows simultaneously.
#
# Stage B extractors run in priority order each time:
#   concall → results → rating → presentation → annual_report
# Each extractor is independent; a rate-limit in one does not block the others.

on:
  schedule:
    # Mon–Fri: every 3h 10AM-7PM IST + once 2AM overnight
    - cron: '30 4,7,10,13 * * 1-5'   # IST 10:00 / 13:00 / 16:00 / 19:00
    - cron: '30 20 * * 1-5'           # IST 02:00 overnight
    # Saturday: 10AM / 1PM / 4PM IST (no overnight)
    - cron: '30 4,7,10 * * 6'
    # Sunday: 1PM IST only
    - cron: '30 7 * * 0'
  workflow_dispatch:            # manual trigger any time

concurrency:
  group: phase2-pipeline
  cancel-in-progress: false     # queue next run; never kill an active processing job

defaults:
  run:
    shell: bash   # use Git Bash on Windows self-hosted runner

jobs:
  phase2:
    runs-on: self-hosted
    timeout-minutes: 180  # concalls are universal — all must complete; peak season can take 60-90m

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # On self-hosted runner, packages persist between runs — this is fast (~5s).
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── Skip check ── reads Drive phase2_latest.json; sets skip=true if queue
      # is empty AND last run was < 45 min ago. Prevents N back-to-back redundant
      # runs when the machine was off and cron slots accumulated.
      # Fail-safe: if Drive unreachable → skip=false (always proceed).
      - name: Skip check
        id: fresh
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/pipeline_skip_check.py --pipeline phase2

      - name: Write credentials
        if: steps.fresh.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p _sec
          # Write the saved OAuth token (contains refresh_token — auto-refreshes each run,
          # no browser needed). get_drive() detects the refresh_token field and uses it.
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
          } > .env

      # Stage A: scrape new PDFs from Screener into Drive queue
      - name: Ingest company docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_company_docs.py
        continue-on-error: true

      # Stage B: Screener HTML results table (no LLM — structured numbers)
      - name: Scrape results table
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/scrape_results_table.py
        continue-on-error: true

      # Stage B: process pending docs through Gemini (priority order)
      # Concall: universal — all companies, no portfolio filter, no time limit
      - name: Extract concalls
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_concall.py
        continue-on-error: true

      # Results / rating / presentation / annual_report: portfolio-filtered
      # (once portfolio.csv is live in _index, these skip non-portfolio companies)
      - name: Extract results PDFs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_results.py
        continue-on-error: true

      - name: Extract credit ratings
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_rating.py
        continue-on-error: true

      - name: Extract investor presentations
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_presentation.py
        continue-on-error: true

      - name: Extract annual reports
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/extract_annual_report.py
        continue-on-error: true

      # Housekeeping: delete raw PDFs > 10d (daily digests kept forever)
      - name: Cleanup old docs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/cleanup_company_docs.py
        continue-on-error: true

      # Status snapshot — writes logs/health/phase2_latest.json so app.py can
      # show Phase 2 health alongside the Phase 1 health report
      - name: Write Phase 2 status
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/write_phase2_status.py
        continue-on-error: true
