name: infra_health

# CODE-RED infra monitor (user 2026-07-12). Fires ONLY when something is genuinely
# broken (stale critical data, dead cookie/token, failing workflows, known-bad log
# signatures) — names the exact key/cookie + exact fix steps. CRIT also pushes to
# your phone via ntfy. Unlike ops_mail this is silent when healthy, so a real break
# can't hide in perpetual red. Runs early (before the evening batch) + on demand.

on:
  schedule:
    - cron: "15 3 * * *"          # 03:15 UTC = 08:45 IST (after overnight batch)
  workflow_dispatch:

permissions:
  actions: read                    # read other workflows' run logs (the log scan)
  contents: read

concurrency:
  group: infra-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install requests pandas pyarrow python-dotenv google-genai \
            google-api-python-client google-auth google-auth-oauthlib

      - name: Infra health check (code-red on breakage)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO:      ${{ github.repository }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
        run: python scripts/check_infra_health.py
