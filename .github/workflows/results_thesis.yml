name: results_thesis

# ONE mail per good result (same rule as the "Results surge" mail: latest-quarter PAT
# YoY >= 100%, whole universe): a <=200-word "why it did well" thesis from the BSE results
# filing + investor presentation + past guidance + a rule-based chart read.
# Script: scripts/results_thesis_mail.py. One Gemini call per company (FREE_POOL).
#
# Reads shared tables only. Its one write is its own ledger
# (_index/results_thesis_ledger.parquet), stamped only after a confirmed send, so a
# missed run delays a mail but never loses one (candidates stay eligible for 48h).
# BSE PDFs are read in memory — never saved to Drive (no retention step needed).
# Own ledger, NOT the global queue: user-approved rule-7 exception, 2026-10-25.

on:
  schedule:
    # 20:00 IST — after pead.yml (19:00 IST) has refreshed results.parquet
    - cron: "30 14 * * *"
    # 23:30 IST — late-evening filers + decks filed after the results
    - cron: "0 18 * * *"
    # 08:30 IST — anything whose 24h deck wait ran out overnight
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates, docs and decisions only — no Gemini, no mail"
        type: boolean
        default: false
      hours:
        description: "Candidates reported in the last N hours"
        default: "48"
      symbols:
        description: "Only these symbols, comma separated (blank = all candidates)"
        default: ""
      force:
        description: "Re-send those symbols even if already mailed (needs symbols)"
        type: boolean
        default: false

concurrency:
  group: results-thesis
  cancel-in-progress: false

jobs:
  thesis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          FREE_POOL:               ${{ secrets.FREE_POOL }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Results thesis mails
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HOURS:   ${{ inputs.hours }}
          SYMBOLS: ${{ inputs.symbols }}
          FORCE:   ${{ inputs.force }}
        run: |
          ARGS="--hours ${HOURS:-48}"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "$SYMBOLS" ] && ARGS="$ARGS --symbols $SYMBOLS"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python scripts/results_thesis_mail.py $ARGS
