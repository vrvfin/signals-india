name: Guru screen (daily stock screen + new-stock alert)

# Runs the validated Project Guru rules against the latest data and emails
# results. Reads Phase 1's Drive stores (data/ohlcv, fundamentals, universe) —
# it does NOT re-fetch prices or fundamentals from source.
#
# Timing: daily.yml runs 10:30 UTC (16:00 IST). This runs after it so prices
# are fresh. Mondays send the full digest; other weekdays alert only when a
# NEW stock appears.

on:
  schedule:
    - cron: "30 12 * * 1-5"     # 12:30 UTC = 18:00 IST, Mon-Fri (after daily.yml)
  workflow_dispatch:            # on-demand from the Actions tab
    inputs:
      mode:
        description: "mail mode"
        required: false
        default: "auto"
        type: choice
        options: [auto, new, weekly, force, none]
      min_turnover:
        description: "min traded value (Rs cr/day)"
        required: false
        default: "1"

concurrency:
  group: guru-screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same install as every other workflow: guru/ reuses
          # scripts/_extractor_base.py for Drive access, and that module imports
          # google.genai at import time -- so the screen needs the full pinned
          # set even though it makes no LLM calls itself.
          pip install -r requirements.txt
          # openpyxl: reads rule_template.xlsx, writes DAILY_SCREEN_*.xlsx.
          # Kept out of root requirements.txt (Streamlit Cloud diet).
          pip install openpyxl

      # Cache the price/statement cache between runs so we only pull what
      # changed on Drive (sync_from_drive + daily_screen both check modifiedTime).
      - name: Restore guru data cache
        uses: actions/cache@v4
        with:
          path: |
            guru/data/live_ohlcv
            guru/data/fundamentals_hist
            guru/data/_live_sync_stamps.parquet
          key: guru-data-${{ github.run_id }}
          restore-keys: |
            guru-data-

      - name: Write Drive credentials
        env:
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
        run: |
          echo "$GDRIVE_OAUTH_TOKEN_JSON" > token.json
          echo "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > client_secret.json

      # Rules + config live on PRIVATE Drive, not in this public repo.
      - name: Fetch rules & config from Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python guru/config_sync.py --download

      - name: Sync market cap + fundamentals from Phase 1 (Drive)
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python guru/sync_from_drive.py

      - name: Run screen
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: |
          python guru/daily_screen.py --sync \
            --min-mcap 100 \
            --min-turnover ${{ github.event.inputs.min_turnover || '1' }}

      - name: Decide mail mode
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ -z "$M" ] || [ "$M" = "auto" ]; then
            if [ "$(date -u +%u)" = "1" ]; then M="weekly"; else M="new"; fi
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "mail mode: $M"

      - name: Send mail
        if: steps.mode.outputs.mode != 'none'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python guru/screen_mailer.py --mode ${{ steps.mode.outputs.mode }}

      # Persist the "what did we see last time" snapshot to Drive, so NEW-stock
      # detection survives the runner being wiped between runs.
      - name: Save snapshot to Drive
        if: always()
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python guru/config_sync.py --push-snapshot

      # The screen output is NOT committed back — this repo is public and the
      # snapshot/results are personal research output. They are emailed and
      # attached to the run instead.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guru-screen-${{ github.run_number }}
          path: |
            guru/DAILY_SCREEN_*.xlsx
            guru/screen_mail_preview.html
          retention-days: 30
          if-no-files-found: warn
