name: narrative-report

# Manual dispatch only. This pipeline is per-company and on-demand, not a nightly sweep:
# a full run is ~25-34 LLM calls, and free-tier quota is per (Cloud project, model, day)
# — a scheduled fan-out would starve the Phase-2 extractors that share it.
on:
  # DAILY at 18:00 IST — drains narrative_queue.parquet, exactly as deepdive.yml drains
  # deep_dive_queue. Add companies with:  run_report.bat  (CI option) or
  #   python scripts/company_narrative_report.py --add "TCS"
  schedule:
    - cron: "30 12 * * *"        # 12:30 UTC = 18:00 IST, once a day
  workflow_dispatch:
    inputs:
      names:
        description: "Company token(s), space separated. LEAVE BLANK to drain the queue."
        required: false
        type: string
      sections:
        description: "Optional: only these section numbers (space separated, blank = all)"
        required: false
        type: string
      skip_audit:
        description: "Skip the independent audit pass (not recommended)"
        required: false
        type: boolean
        default: false
      ignore_preflight:
        description: "Publish even if data-integrity checks FAIL"
        required: false
        type: boolean
        default: false
      mail:
        description: "Email the report (md + html attached) to NOTIFY_EMAIL"
        required: false
        type: boolean
        default: true
      fetch_missing:
        description: "Pull missing filings from Screener/BSE/NSE before building"
        required: false
        type: boolean
        default: true

jobs:
  report:
    runs-on: ubuntu-latest
    # Generation is sequential with inter-call sleeps; a stuck provider must not hold
    # the runner for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # Use the SAME requirements.txt deepdive.yml installs. The hand-listed set
          # here was missing google-genai (scripts/_extractor_base.py and gemini_pool.py
          # do `from google import genai`, the NEW SDK — NOT google-generativeai), so the
          # very first import failed with "cannot import name 'genai' from 'google'".
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # get_drive() reads GDRIVE_OAUTH_CLIENT_SECRET_PATH — a FILE PATH, not inline JSON.
      # Passing GDRIVE_OAUTH_TOKEN_JSON as a per-step env var (my earlier mistake) left
      # that file-path var unset and every step crashed with
      # KeyError: 'GDRIVE_OAUTH_CLIENT_SECRET_PATH'. This mirrors deepdive.yml: write the
      # OAuth blob to a file and a `.env` the scripts load, so every later step inherits
      # the credentials and there are no per-step env blocks to drift.
      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          FREE_POOL:               ${{ secrets.FREE_POOL }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
          CEREBRAS_API_KEY:        ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY:            ${{ secrets.GROQ_API_KEY }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          # backfill_company_docs (invoked by --fetch-missing) authenticates via
          # daily_research_summary.drive_service, which reads GDRIVE_OAUTH_TOKEN_PATH
          # (tk.json) DIRECTLY rather than the refresh-token path get_drive uses. The
          # OAuth blob already carries the refresh token, so the same file serves both;
          # without this, fetch-missing crashed with FileNotFoundError on tk.json.
          cp _sec/oauth.json _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            # Multi-line key blobs -> one comma-joined line so dotenv keeps every key.
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "GEMINI_API_KEY=$(printf '%s' "$GEMINI_API_KEY" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
            echo "CEREBRAS_API_KEY=$(printf '%s' "$CEREBRAS_API_KEY" | tr '\r\n' ',,')"
            echo "GROQ_API_KEY=$(printf '%s' "$GROQ_API_KEY" | tr '\r\n' ',,')"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env
          echo "wrote .env with $(grep -c = .env) vars (values not shown)"

      # Preflight only for an EXPLICIT company dispatch. A queue-drain run (blank
      # names) has no single company to check here — company_narrative_report.py
      # preflights each queued company itself in step [1/6] and skips any that FAILs
      # unless --ignore-preflight, so the gate is enforced either way.
      - name: Preflight — is the data fit to publish?
        id: preflight
        if: inputs.names != ''
        run: |
          # Capture the EXIT CODE, don't let the step's pass/fail conflate a crash with
          # a data verdict. narrative_preflight returns 2 ONLY for an integrity FAIL;
          # 1 is a crash (a missing dependency once landed here and looked like a data
          # FAIL); 0 is clean. A crash must fail the job loudly, not be dressed up as
          # "the data is bad".
          set +e
          python scripts/narrative_preflight.py --names ${{ inputs.names }}
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then
            echo "::error::Preflight CRASHED (exit 1) — this is a code/dependency bug, not a data problem."
            exit 1
          fi

      - name: Stop if preflight found a data-integrity FAIL
        if: >
          steps.preflight.outputs.rc == '2' &&
          inputs.ignore_preflight != 'true'
        run: |
          echo "::error::Preflight reported a data-integrity FAIL for ${{ inputs.names }}."
          echo "Re-dispatch with ignore_preflight=true to publish anyway."
          exit 1

      - name: Generate narrative report
        # Credentials come from the .env written above (scripts call load_dotenv), so no
        # per-step env block — that duplication is exactly what drifted before.
        run: |
          # On a SCHEDULE event `inputs.*` are all empty, so:
          #  - `--names` (empty) -> the script drains narrative_queue.parquet
          #  - `!= 'false'` keeps mail + fetch ON for scheduled runs while still letting
          #    a manual dispatch turn them off (mail=false).
          python scripts/company_narrative_report.py \
            ${{ inputs.names != '' && format('--names {0}', inputs.names) || '' }} \
            --outdir ./_narrative \
            --upload \
            ${{ inputs.mail != 'false' && '--mail' || '' }} \
            ${{ inputs.fetch_missing != 'false' && '--fetch-missing' || '' }} \
            ${{ inputs.sections != '' && format('--sections {0}', inputs.sections) || '' }} \
            ${{ inputs.skip_audit == 'true' && '--skip-audit' || '' }} \
            ${{ inputs.ignore_preflight == 'true' && '--ignore-preflight' || '' }}

      - name: Retention — no raw PDF survives the run
        # CLAUDE.md global rule 1: no raw PDF persists more than 2 days after processing.
        # This pipeline re-fetches documents into a local cache, so the cache is destroyed
        # here rather than relying on the runner being ephemeral.
        if: always()
        run: |
          rm -rf ./_narrative/_src_* || true
          find ./_narrative -name '*.pdf' -delete || true
          echo "document cache cleared"

      - name: Upload report artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-report
          # Markdown, HTML and the JSON layers — NOT the source cache (privacy: raw
          # filings never leave as artefacts, mirroring the Workflow A rule).
          path: |
            _narrative/*.md
            _narrative/*.html
            _narrative/factpack_*.json
            _narrative/narrative_*.json
            _narrative/audit_*.json
          retention-days: 14
          if-no-files-found: warn
