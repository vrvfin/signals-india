name: narrative-report

# Manual dispatch only. This pipeline is per-company and on-demand, not a nightly sweep:
# a full run is ~25-34 LLM calls, and free-tier quota is per (Cloud project, model, day)
# — a scheduled fan-out would starve the Phase-2 extractors that share it.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Company token(s) — ISIN, NSE symbol, or name fragment (space separated)"
        required: true
        type: string
      sections:
        description: "Optional: only these section numbers (space separated, blank = all)"
        required: false
        type: string
      skip_audit:
        description: "Skip the independent audit pass (not recommended)"
        required: false
        type: boolean
        default: false
      ignore_preflight:
        description: "Publish even if data-integrity checks FAIL"
        required: false
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Generation is sequential with inter-call sleeps; a stuck provider must not hold
    # the runner for hours.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pandas pyarrow PyMuPDF pdfplumber requests \
                      google-api-python-client google-auth google-auth-oauthlib python-dotenv

      - name: Preflight — is the data fit to publish?
        id: preflight
        continue-on-error: true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/narrative_preflight.py --names ${{ inputs.names }}

      - name: Stop if preflight failed and the override was not set
        if: steps.preflight.outcome == 'failure' && inputs.ignore_preflight != true
        run: |
          echo "::error::Preflight reported a data-integrity FAIL. Read the step above."
          echo "Re-dispatch with ignore_preflight=true to publish anyway."
          exit 1

      - name: Generate narrative report
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          # Generator pool (CLAUDE.md: FREE_POOL is the default for new programs)
          FREE_POOL: ${{ secrets.FREE_POOL }}
          # Independent adjudicator — a DIFFERENT model family from the generator.
          # Without these the audit degrades to Gemini and says so on the report.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          python scripts/company_narrative_report.py \
            --names ${{ inputs.names }} \
            --outdir ./_narrative \
            --upload \
            ${{ inputs.sections != '' && format('--sections {0}', inputs.sections) || '' }} \
            ${{ inputs.skip_audit && '--skip-audit' || '' }} \
            ${{ inputs.ignore_preflight && '--ignore-preflight' || '' }}

      - name: Retention — no raw PDF survives the run
        # CLAUDE.md global rule 1: no raw PDF persists more than 2 days after processing.
        # This pipeline re-fetches documents into a local cache, so the cache is destroyed
        # here rather than relying on the runner being ephemeral.
        if: always()
        run: |
          rm -rf ./_narrative/_src_* || true
          find ./_narrative -name '*.pdf' -delete || true
          echo "document cache cleared"

      - name: Upload report artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narrative-report
          # Markdown, HTML and the JSON layers — NOT the source cache (privacy: raw
          # filings never leave as artefacts, mirroring the Workflow A rule).
          path: |
            _narrative/*.md
            _narrative/*.html
            _narrative/factpack_*.json
            _narrative/narrative_*.json
            _narrative/audit_*.json
          retention-days: 14
          if-no-files-found: warn
