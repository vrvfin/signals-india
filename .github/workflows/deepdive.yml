name: deepdive

# Workflow B (OT7) — company deep dive. Runs entirely on CLOUD data (Screener
# parquet, BSE API, Drive summaries), so GitHub Actions is the right home here.
# It drains deep_dive_queue.parquet once a day; manual dispatch + repository_dispatch
# let you trigger it on demand right after queueing a company.

on:
  schedule:
    - cron: "30 2 * * *"        # 02:30 UTC = 08:00 IST, once a day
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-deepdive]

concurrency:
  group: deepdive
  cancel-in-progress: false      # never run two deep-dive passes at once

jobs:
  deepdive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      NOTIFY_SINCE: ${{ steps.run_deepdive.outputs.started_at }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install google-generativeai requests

      - name: Run deep-dive queue
        id: run_deepdive
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S)" >> $GITHUB_OUTPUT
          python scripts/company_deep_report.py

      - name: Send email notifications
        if: always()
        run: python scripts/notify_deepdive.py
