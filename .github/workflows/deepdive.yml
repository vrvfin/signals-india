name: deepdive

# Workflow B (OT7) — company deep dive. Runs entirely on CLOUD data (Screener
# parquet, BSE API, Drive summaries), so GitHub Actions is the right home here.
# It drains deep_dive_queue.parquet once a day; manual dispatch + repository_dispatch
# let you trigger it on demand right after queueing a company.

on:
  schedule:
    - cron: "30 2 * * *"        # 02:30 UTC = 08:00 IST, once a day
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-deepdive]

concurrency:
  group: deepdive
  cancel-in-progress: false      # never run two deep-dive passes at once

jobs:
  deepdive:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
      # Stop starting new docs/companies ~15 min before the 120-min wall so the
      # queue + sidecars flush cleanly (no SIGKILL); remaining work resumes next run.
      DEEPDIVE_DEADLINE_MIN: "105"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          FREE_POOL:               ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
          BACKFILL_GEMINI_KEY_1:   ${{ secrets.BACKFILL_GEMINI_KEY_1 }}
          BACKFILL_GEMINI_KEY_2:   ${{ secrets.BACKFILL_GEMINI_KEY_2 }}
          BACKFILL_GEMINI_KEY_3:   ${{ secrets.BACKFILL_GEMINI_KEY_3 }}
          BACKFILL_GEMINI_KEY_4:   ${{ secrets.BACKFILL_GEMINI_KEY_4 }}
          BACKFILL_GEMINI_KEY_5:   ${{ secrets.BACKFILL_GEMINI_KEY_5 }}
          BACKFILL_GEMINI_KEY_6:   ${{ secrets.BACKFILL_GEMINI_KEY_6 }}
          BACKFILL_GEMINI_KEY_7:   ${{ secrets.BACKFILL_GEMINI_KEY_7 }}
          BACKFILL_GEMINI_KEY_8:   ${{ secrets.BACKFILL_GEMINI_KEY_8 }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
          YOUTUBE_API_KEY:         ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            # Deep dive runs on the big FREE_POOL+BACKFILL quota (separate Cloud
            # projects, lightly used outside the nightly window). Secret may be a
            # multi-line blob — flatten to one comma-joined line so dotenv keeps
            # every key. GEMINI_API_KEY stays as the last-resort fallback prefix.
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY_1=$BACKFILL_GEMINI_KEY_1"
            echo "BACKFILL_GEMINI_KEY_2=$BACKFILL_GEMINI_KEY_2"
            echo "BACKFILL_GEMINI_KEY_3=$BACKFILL_GEMINI_KEY_3"
            echo "BACKFILL_GEMINI_KEY_4=$BACKFILL_GEMINI_KEY_4"
            echo "BACKFILL_GEMINI_KEY_5=$BACKFILL_GEMINI_KEY_5"
            echo "BACKFILL_GEMINI_KEY_6=$BACKFILL_GEMINI_KEY_6"
            echo "BACKFILL_GEMINI_KEY_7=$BACKFILL_GEMINI_KEY_7"
            echo "BACKFILL_GEMINI_KEY_8=$BACKFILL_GEMINI_KEY_8"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
          } > .env

      - name: Install system deps for PDF rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install google-generativeai requests weasyprint markdown \
            python-pptx python-docx PyMuPDF youtube-transcript-api

      - name: Run deep-dive queue
        id: run_deepdive
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S)" >> $GITHUB_OUTPUT
          python scripts/company_deep_report.py

      - name: Send email notifications
        if: always()
        env:
          NOTIFY_SINCE: ${{ steps.run_deepdive.outputs.started_at }}
        run: python scripts/notify_deepdive.py
