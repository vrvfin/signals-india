name: t4_nightly

# Phase 3 T4 + T5 — nightly scorecard refresh + catalyst notes.
# Chain: investigative fraud (lists + rolling news + SEBI/NFRA) -> valuation ->
# financial fraud rules -> 8-factor scorecard -> fraud tracker -> catalysts.
# Triggered by pead COMPLETING (workflow_run, fires on success AND failure) —
# guaranteed to run after fresh results land, immune to cron drift, and still
# well before backfill_nightly (23:30 IST) Drive contention.

on:
  workflow_run:
    workflows: ["pead"]
    types: [completed]
  workflow_dispatch:
    inputs:
      catalyst_limit:
        description: "Max catalyst notes this run"
        default: "30"
      news_budget:
        description: "Non-PF companies news-scanned this run (40/day = 90d cycle)"
        default: "40"

concurrency:
  group: t4-nightly
  cancel-in-progress: false        # never two scorecard passes at once (parquet writes)

jobs:
  guard:
    # t4 fires on EVERY pead completion (incl. the skipped fallback run) —
    # once today's chain succeeded, later triggers skip. Dispatch always runs.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.chk.outputs.go }}
    steps:
      - id: chk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            --get --data-urlencode "status=success" \
            --data-urlencode "created=>=${today}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/t4_nightly.yml/runs" \
            | grep -c '"run_started_at"' || true)
          echo "successful runs today: $n"
          [ "$n" -gt 0 ] && echo "go=false" >> "$GITHUB_OUTPUT" \
                         || echo "go=true" >> "$GITHUB_OUTPUT"

  t4:
    needs: guard
    if: needs.guard.outputs.go == 'true'
    runs-on: ubuntu-latest
    # 90 was not enough: the run of 2026-08-12 was CANCELLED at 94.6 min inside
    # "Derive forensic metrics", skipping fraud rules, screener grades, the 8-factor
    # scorecard, combined strength, the fraud tracker, the FACT table and catalyst
    # notes. A timeout SIGKILL also cannot run atexit, which is how _extract.lock was
    # found held by 'live' for 337 minutes.
    timeout-minutes: 170
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
          FRAUD_API_KEY_1:         ${{ secrets.FRAUD_API_KEY_1 }}
          FRAUD_API_KEY_2:         ${{ secrets.FRAUD_API_KEY_2 }}
          GMAIL_USER:              ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:      ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:            ${{ secrets.NOTIFY_EMAIL }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          # ALSO write the token to tk.json. _extractor_base.get_drive() is happy
          # with CLIENT_SECRET_PATH pointing at a token (it detects refresh_token
          # and uses it directly) — do NOT repoint it, that would break every t4
          # script. But ingest_fundamentals runs its own auth: it checks
          # GDRIVE_OAUTH_TOKEN_PATH first and only falls back to the client-secret
          # OAuth flow, which rejected the token file with "Client secrets must be
          # for a web or installed app" and killed the step in 0.6s behind
          # continue-on-error. Writing tk.json lets it find a valid token.
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "GEMINI_API_KEY=$GEMINI_API_KEY"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            # flatten multi-line secret (KEY_N=value lines) to one comma-joined line
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
            echo "FRAUD_API_KEY_1=$FRAUD_API_KEY_1"
            echo "FRAUD_API_KEY_2=$FRAUD_API_KEY_2"
            echo "GMAIL_USER=$GMAIL_USER"
            echo "GMAIL_APP_PASSWORD=$GMAIL_APP_PASSWORD"
            echo "NOTIFY_EMAIL=$NOTIFY_EMAIL"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Investigative fraud (lists + rolling news + SEBI/NFRA)
        run: >
          python scripts/build_investigative_fraud.py
          --with-news --news-budget "${{ github.event.inputs.news_budget || '40' }}"
          --with-sebi --with-nfra --with-gemini --email
        continue-on-error: true

      # ORDERING FIX (user 2026-07-18): ingest_fundamentals refreshes BOTH
      # fundamentals/statements/ (source of financials_derived) and
      # fundamentals/summary.parquet (pe / market_cap_cr / profit_growth_1y /
      # book_value). It was on a standalone 14:30 UTC cron — ~1h AFTER this job — so
      # on the day a company reported, financials_derived and every consumer was a
      # full cycle stale: screener_grades, scorecard (score_fundamental 18% +
      # score_fin_health 13.5%), fraud_risk, valuation, company_facts, deep dive.
      # It cannot simply run earlier: `--recent-results-days 4` needs results.parquet,
      # which pead only refreshes at 13:30 UTC. So run it HERE, inside the chain:
      #   results (pead) -> statements + summary -> derived -> valuation/grades/
      #   scorecard/facts -> mails
      # MUST stay ahead of build_valuation (reads summary.parquet) AND
      # build_derived_from_statements (reads statements/). Investigative fraud above
      # needs neither, so it keeps its head start and its mail still goes out first.
      # ~5 min in results season, seconds off-season (no recent declarers).
      - name: Fundamentals incremental (today's reporters — MUST precede valuation+derived)
        env:
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: python scripts/ingest_fundamentals.py --recent-results-days 4
        continue-on-error: true

      - name: Valuation (segment + own-history P/E)
        run: python scripts/build_valuation.py
        continue-on-error: true

      # Full-universe forensic metrics from fundamentals/statements/ -> lifts
      # financials_derived (and thus fraud_risk) from ~45 to the whole universe.
      - name: Derive forensic metrics (full universe from statements)
        run: python scripts/build_derived_from_statements.py --workers 24
        continue-on-error: true

      - name: Financial fraud rules (T2 forensics)
        run: python scripts/build_fraud_risk.py
        continue-on-error: true

      # 6-rule attractiveness heatmap (YOY/QOQ/Guidance/Valuation/CFO/ROE) ->
      # screener_grades.parquet, rendered on the app's "Screener" page.
      - name: Screener grades (6-rule heatmap)
        run: python scripts/build_screener_grades.py
        continue-on-error: true

      - name: 8-factor scorecard blend
        run: python scripts/build_scorecard.py

      # 3-axis shortlist: strong technical + results + guidance (user 2026-07-08).
      # Needs conviction.csv (daily.yml), growth_surge + guidance_vs_actual (pead),
      # screener_grades (above). Writes daily/weekly/quarterly CSVs + mails top 30.
      - name: Combined strength list + mail (tech + results + guidance)
        run: python scripts/build_combined_strength.py
        continue-on-error: true

      - name: Fraud tracker (T7 — snapshot + history)
        run: python scripts/build_fraud_tracker.py
        continue-on-error: true

      - name: Company FACT table + peer medians (T10)
        run: python scripts/build_company_facts.py
        continue-on-error: true

      - name: Catalyst notes (strong stocks + PF daily, Gemini lite)
        run: >
          python scripts/build_catalyst_notes.py
          --limit "${{ github.event.inputs.catalyst_limit || '30' }}" --email
        continue-on-error: true

      - name: AR digest mail (one per day, 19:00 batch — slots write, this mails)
        if: always()
        run: python scripts/daily_ar_summary.py --email
        continue-on-error: true

      # PF quarterly-results digest (user 2026-08-05): season-scoped, cumulative —
      # every PF holding that has reported the CURRENT quarter, newest first, with
      # the 6-quarter revenue/profit/EPS/margin table + YoY/QoQ. Never mixes two
      # quarters. Self-gating: silent outside the results season and once every
      # holding has reported. Runs after ingest_fundamentals refreshed statements.
      - name: PF results digest mail (quarterly numbers per holding, season)
        if: always()
        run: python scripts/pf_results_digest.py
        continue-on-error: true

      # Quarterly teardown (user 2026-08-09): the NUANCE layer beside the numbers
      # digest above. For each PF holding that reported in the last 24h — clean PAT
      # (profit stripped of the other-income swing and tax drift), the divergence
      # engine against this repo's own forensic thresholds, the merged red-flag
      # register (ar_red_flags + rating concerns/tripwires + gf4 + announcements),
      # and the deck teardown where one exists.
      # Self-gating: exits silently when nothing reported in the window, and a
      # per-season ledger (quarter_teardown_mailed.parquet) means each holding is
      # mailed once. Runs after ingest_fundamentals has refreshed statements.
      - name: Quarterly teardown mail (clean PAT + early warnings, last 24h)
        if: always()
        run: python scripts/quarter_teardown.py --daily
        continue-on-error: true

      - name: PF daily digest mail (filings/research/flags/community per holding)
        if: always()
        run: python scripts/run_pf_digest.py
        continue-on-error: true

      # PF "new documents" digest (user 2026-07-11): collects Phase-2 summaries of
      # newly-arrived AR/concall/presentation/results/rating + announcements per PF
      # stock, deduped via pf_docs_mailed.parquet. Daily 2-day window.
      - name: PF new-documents digest mail (narrative summaries per holding)
        if: always()
        run: python scripts/run_pf_docs_digest.py
        continue-on-error: true
