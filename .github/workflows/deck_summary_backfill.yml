name: deck_summary_backfill

# Re-reads investor decks already filed and stores the standalone 18-section summary.
#
# WHY IT NEEDS ITS OWN WORKFLOW. The daily mail run reads decks at INGEST, because
# retention rule 1 deletes the source PDF two days later — measured 2026-08-16, 24 of the
# 25 newest decks on Drive already 404. Everything filed before this pass existed is
# therefore unreachable through Drive, and only reachable through the queue's pdf_url.
# Scope at first run: 212 decks across 45 of 51 PF holdings, 2025Q2 to 2026Q3.
#
# IT IS RESUMABLE AND EXPECTS TO BE RESUMED. Work is selected by "has no deck_summary row
# for this source_doc_id", so free-tier quota exhaustion costs at most one flush window.
# 212 decks will not fit in one day's quota; run it repeatedly until the log says
# "Nothing to do."
#
# It never uploads a PDF, never mutates processing_queue, and holds _extract.lock only
# for the few seconds of each flush — so it can run alongside Phase 2 without starving it.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max decks this run (blank = as many as quota allows)"
        default: ""
      symbols:
        description: "Optional comma list, e.g. APLAPOLLO,RISHABH"
        default: ""
      since:
        description: "Earliest announcement date (default ~6 quarters back)"
        default: "2025-02-01"
      dry_run:
        description: "List the work and stop"
        type: boolean
        default: false
  schedule:
    # 02:10 IST daily while the backfill is outstanding. Deliberately off-peak and well
    # clear of the 09:05 IST mail run, so the two never contend for the lock or the keys.
    - cron: "40 20 * * *"

concurrency:
  group: deck-summary-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Write credentials (.env)
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          FREE_POOL:               ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY:     ${{ secrets.BACKFILL_GEMINI_KEY }}
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/oauth.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON" > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/oauth.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
            echo "FREE_POOL=$(printf '%s' "$FREE_POOL" | tr '\r\n' ',,')"
            echo "BACKFILL_GEMINI_KEY=$(printf '%s' "$BACKFILL_GEMINI_KEY" | tr '\r\n' ',,')"
          } > .env

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Self-tests (fail fast before touching Drive)
        run: |
          python scripts/deck_summary.py --self-test
          python scripts/backfill_deck_summary.py --self-test

      - name: Backfill deck summaries
        run: >
          python scripts/backfill_deck_summary.py
          --since "${{ inputs.since || '2025-02-01' }}"
          --deadline-min 300
          --flush-every 5
          ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
          ${{ inputs.symbols && format('--symbols {0}', inputs.symbols) || '' }}
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
