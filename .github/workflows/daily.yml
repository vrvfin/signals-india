name: Daily Pipeline Execution

on:
  # NO `schedule:` block. GitHub's own cron fired this workflow between 4h35m
  # and 10h42m LATE on 2026-08-27 / 08-28 / 08-31 / 09-01 (createdAt == startedAt
  # on every run, so it is the scheduler itself, not runner queue wait). Those
  # late runs landed at ~02:30 IST and then caused the real 16:00 IST run to be
  # skipped as a same-IST-day duplicate (Aug 28: "already ran today (IST) —
  # 732m ago"). cron-job.org's repository_dispatch fired within 6 seconds of
  # 10:30:30 UTC every single day, so it is the only trigger we keep.
  workflow_dispatch:          # manual trigger from GitHub UI
  repository_dispatch:
    types: [trigger-phase1]   # cron-job.org, every weekday 10:30 UTC = 16:00 IST

# One Phase 1 at a time. The two triggers previously BOTH ran and overlapped for
# 30-60 minutes every weekday (Aug 13-26), writing the same Drive files
# concurrently, and the second run's diff_vs_yesterday compared against the first
# run from 30 minutes earlier rather than against yesterday.
concurrency:
  group: phase1-daily
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # No explicit timeout — defaults to GitHub-hosted runners' 6h (360-min) hard cap,
    # same as universe_refresh.yml. The 180-min cap killed the run mid-strategy once
    # the universe doubled to ~5,029 (NSE+BSE); rather than chase a number, we let it
    # run as long as it needs. Ingest is now bounded-parallel (--workers 8 in
    # ingest_ohlcv / fetch_bse_only_ohlcv / compute_features), so a normal day is
    # ~30-40m anyway; the 6h ceiling is just a safety net.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 deprecated Jun 2 2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-p1-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-p1-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # yfinance excluded from root requirements.txt (causes malloc crash on Streamlit Cloud).
          # Install it here for the pipeline only.
          pip install "yfinance>=1.3.0"
          # PyMuPDF: announcement ingest's Groq/Cerebras text fallback extracts PDF
          # text via fitz. Kept out of root requirements.txt (Streamlit Cloud diet).
          pip install PyMuPDF

      # ── Skip check ── reads Drive health report; sets skip=true if Phase 1
      # already ran today (IST). Prevents redundant processing when duplicate
      # cron slots queue up. Bypassed on manual trigger (workflow_dispatch) so
      # you can always force a full rerun from the GitHub UI.
      # Fail-safe: Drive unreachable → skip=false (always proceed).
      - name: Skip check
        id: fresh
        if: github.event_name != 'workflow_dispatch'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/pipeline_skip_check.py --pipeline phase1

      - name: Write credentials from secrets
        if: steps.fresh.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE:         ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      # ---- Data pull (all best-effort; the health-check is the judge) ----
      - name: Build universe
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/build_universe.py
        continue-on-error: true

      - name: Ingest OHLCV (incremental, NSE)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_ohlcv.py
        continue-on-error: true

      # BSE-only EOD — DAILY incremental via the BSE API (api.bseindia.com).
      # Replaces the Yahoo `.BO` feed, which left BSE-only names ~3-5 days stale
      # (only ~2 of 2,635 current). The API returns the latest completed session
      # for ~92% of names (tested) and is faster (~5.5m vs ~14m). Appends one bar
      # per scrip into data/ohlcv/ (dedup-merge). Full 2y history is still seeded
      # by fetch_bse_only_ohlcv.py --backfill in universe_refresh.yml (weekly).
      - name: Ingest OHLCV (incremental, BSE-only via BSE API)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_bse_eod_api.py --workers 16
        continue-on-error: true

      # Listing dates — must run AFTER both OHLCV steps, since new names are
      # dated from the first bar of data/ohlcv when NSE has no date for them.
      # DAILY mode only touches names with no row yet (typically a handful), so
      # this is seconds: the one-off ~45m sweep is `--backfill`, run manually.
      # Feeds the IPO view, which previously read master_list.listing_date and
      # was blind to every BSE (0/2,479) and NSE SME (0/576) name.
      - name: Update listing dates
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python scripts/build_listing_dates.py --watch
          python scripts/build_listing_dates.py
          python scripts/build_listing_dates.py --classify
        continue-on-error: true

      - name: Ingest indices + macro
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_indices_macro.py
        continue-on-error: true

      - name: Fix indices (NSE midcap/smallcap)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fix_indices_nse.py
        continue-on-error: true

      - name: Ingest FII/DII
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_fii_dii.py
        continue-on-error: true

      # ---- Features ----
      - name: Compute features
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/compute_features.py
        continue-on-error: true

      # Raise any long-horizon high that today's bar exceeded. Exact for the
      # all-time high; the N-year windows can only move UP between re-seeds,
      # which errs toward "further from its high" and so under-fires rather
      # than over-fires. Re-seed periodically with --seed to clear the drift.
      - name: Update price highs
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/build_price_highs.py --update
        continue-on-error: true

      # Market state runs BEFORE the strategies: it depends only on features +
      # indices + macro (all ready above), and CANSLIM's "M" rule reads
      # data/market_state/latest.parquet. Running it after the strategies (the
      # old order) fed CANSLIM YESTERDAY's health score — which on 2026-07-21
      # sat on the opposite side of the 40 threshold from today's actual (42.2
      # stale vs 39.9 fresh), flipping the M rule. (audit #25)
      - name: Market state
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/market_state.py
        continue-on-error: true

      # ---- Strategies (each isolated; one failing won't stop the rest) ----
      - name: Strategy - Momentum
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_momentum.py
        continue-on-error: true

      - name: Strategy - MA respect
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_ma_respect.py
        continue-on-error: true

      - name: Strategy - Qullamaggie
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_qullamaggie.py
        continue-on-error: true

      - name: Strategy - Minervini
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_minervini.py
        continue-on-error: true

      - name: Strategy - Darvas
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_darvas.py
        continue-on-error: true

      - name: Strategy - Volume
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_volume.py
        continue-on-error: true

      - name: Strategy - Pullback
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_pullback.py
        continue-on-error: true

      # New listings form SHORTER and DEEPER first bases than the classic
      # patterns allow, so darvas (10% max range) and minervini (needs a 200-day
      # average) reject them on technicalities and the most reactive part of the
      # market is invisible to the engine. Needs listing_dates.parquet.
      - name: Strategy - IPO base
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_ipo_base.py
        continue-on-error: true

      # ---- Fundamentals-dependent strategies ----
      # Fundamentals + market cap ingestion moved to its own weekly workflow
      # (fundamentals.yml): the full-universe Screener pull + statement history
      # takes hours and no longer fits the daily 180-min budget. The strategies
      # below read the summary.parquet that fundamentals.yml keeps fresh.
      - name: Strategy - CANSLIM
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_canslim.py
        continue-on-error: true

      # Refresh the results feed BEFORE PEAD consumes it. results.parquet was
      # previously refreshed only by pead.yml at 16:00 UTC (21:30 IST) — i.e.
      # AFTER this workflow read it at ~16:00 IST — so strategy_pead.py anchored
      # on a feed up to ~18.5h stale and saw the freshest declarations a day late.
      - name: Refresh results feed (for PEAD)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/scrape_results_table.py
        continue-on-error: true

      - name: Strategy - PEAD
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_pead.py
        continue-on-error: true

      # ---- Aggregate + market state ----
      - name: Aggregate signals
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/aggregate_signals.py
        continue-on-error: true

      # Per-symbol signal-appearance history (tenure / fresh-new-recent / drops).
      # Reads the dated snapshots aggregate_signals just wrote; must run after it.
      - name: Signal membership
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/build_signal_membership.py
        continue-on-error: true

      # Score yesterday's calls before anything else consumes today's list.
      # Reads open_signals.csv (the frozen entry/stop) + OHLCV, and writes the
      # outcome ledger. Silent until aggregate_signals has run at least once.
      - name: Signal tracker (did the calls work?)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/signal_tracker.py
        continue-on-error: true

      # ---- BSE announcements -> LLM summary (independent of Phase 2) ----
      # Runs after Aggregate signals (needs the fresh PF + n_strategies>=2 watchlist
      # with the Rs1cr turnover floor). Pulls the day's market-wide BSE filings,
      # summarises the new material ones (own ledger dedup), writes daily_update_summary
      # + company_page sections. Uses FREE_POOL keys (default for new programs).
      - name: BSE announcement summaries
        if: steps.fresh.outputs.skip != 'true'
        # 4-day lookback catches filings on weekends / days a run was skipped or late
        # (newsid dedup prevents repeats). --top-n 300: also fetch PER-COMPANY (strScrip)
        # for PF + top-300 by Phase-1 conviction (aggregated signals) so their filings are
        # never dropped by the market-wide page cap (the Kernex miss). --limit 300 bounds;
        # the backlog is cleared over subsequent runs (newsid dedup).
        run: python scripts/ingest_announcements.py --lookback-days 4 --top-n 300 --limit 300
        continue-on-error: true
        env:
          FREE_POOL:            ${{ secrets.FREE_POOL }}
          BACKFILL_GEMINI_KEY:  ${{ secrets.BACKFILL_GEMINI_KEY }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          # Groq/Cerebras text fallback: Gemini's shared FREE_POOL quota is often
          # drained by backfill daytime slots before this 16:00 IST step runs
          # (2026-07-02: 8 of 858 summarised). Alt quota is independent.
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}

      # ---- PF Daily Brief email (A announcements + B research + C news + D alt) ----
      # Runs AFTER the announcement summaries so the ledger is fresh. Assembles a
      # per-PF-company brief — materiality-ranked exchange filings (announcement_ledger)
      # + company-relevant research snippets (research_index) + reputable-source news
      # (Google-News RSS via company_deep_report.news_block) — and emails it. D adds
      # sector-gated alt sources (alt_sources.py): US-FDA drug recalls for PHARMA holdings
      # (openFDA) + RBI circulars for FINANCE holdings (RBI RSS), both public, no keys.
      # Pure READER of existing Drive parquets + RSS/APIs; NO Gemini spend. GDRIVE creds
      # come from the .env written above (load_dotenv); only the Gmail secrets are per-step.
      # continue-on-error so a mail hiccup never fails the pipeline.
      - name: PF Daily Brief email
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/daily_brief.py --research-days 30 --news-days 21 --fda-days 60 --rbi-days 7
        continue-on-error: true
        env:
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:        ${{ secrets.NOTIFY_EMAIL }}

      # ---- Truth gate: the ONLY step allowed to fail the run ----
      - name: Health check (truth gate)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/pipeline_healthcheck.py

      # ── Phase 2 backup trigger (Layer 2 reliability) ──────────────────────
      # GitHub Actions scheduled jobs can be delayed 30-90 min or skipped.
      # This step fires Phase 2 via workflow_dispatch after every Phase 1 run,
      # guaranteeing at least one Phase 2 execution per business day.
      #
      # Requires: ACTIONS_PAT secret (GitHub PAT with 'workflow' scope).
      # One-time setup:
      #   1. GitHub → Settings → Developer settings → Personal access tokens (classic)
      #   2. Generate token with 'workflow' scope. Copy it.
      #   3. Repo → Settings → Secrets → Actions → New secret
      #      Name: ACTIONS_PAT   Value: <your token>
      #
      # Safe if secret not yet set: the step logs a message and exits 0.
      - name: Trigger Phase 2 (backup)
        if: always()
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run phase2.yml --ref main \
              && echo "Phase 2 backup trigger dispatched." \
              || echo "Phase 2 backup trigger failed (will rely on scheduled crons)."
          else
            echo "ACTIONS_PAT not set — Phase 2 backup trigger skipped."
            echo "See daily.yml comment for one-time setup instructions."
          fi
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}

      # ── Push notification (ntfy.sh → phone + desktop) ─────────────────────
      # Fires on success, failure AND skip so you always know the run's state.
      # One-time setup:
      #   1. Pick an unguessable topic, e.g. "signals-india-vrv-7h2k9".
      #   2. Install the "ntfy" app (iOS / Android / desktop web at ntfy.sh)
      #      and SUBSCRIBE to that exact topic.
      #   3. Repo → Settings → Secrets → Actions → New secret
      #         Name: NTFY_TOPIC   Value: <your topic>
      # Safe if the secret is unset: the step logs and exits 0.
      - name: Notify (ntfy push)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
          SKIPPED: ${{ steps.fresh.outputs.skip }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC not set — notification skipped (see setup note above)."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$SKIPPED" = "true" ]; then
            TITLE="Phase 1 skipped"; TAGS="zzz"; PRIO="low"
            MSG="No run today (non-trading day / no fresh data)."
          elif [ "$JOB_STATUS" = "success" ]; then
            TITLE="Phase 1 done"; TAGS="white_check_mark"; PRIO="default"
            MSG="Daily pipeline finished OK — $(date -u '+%Y-%m-%d %H:%M UTC'). Tap to open the run."
          else
            TITLE="Phase 1 FAILED"; TAGS="rotating_light"; PRIO="high"
            MSG="Daily pipeline FAILED — $(date -u '+%Y-%m-%d %H:%M UTC'). Tap to open the run/logs."
          fi
          curl -s -H "Title: $TITLE" -H "Tags: $TAGS" -H "Priority: $PRIO" \
               -H "Click: $RUN_URL" -d "$MSG" "https://ntfy.sh/$NTFY_TOPIC" \
            && echo "ntfy notification sent." || echo "ntfy send failed (non-fatal)."
