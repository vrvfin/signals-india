name: Daily Pipeline Execution

on:
  schedule:
    - cron: '30 10 * * 1-5'  # Mon-Fri 16:00 IST — daily run (OHLCV, features,
                             # strategies, aggregate). Fundamentals/market-cap run
                             # separately in fundamentals.yml (weekly, Mon).
    # UTC 10:30 is pre-US-business-hours (off-peak GitHub), so runner queue wait
    # is ~15-30 min → data consistently ready by IST 17:00-17:30.
  workflow_dispatch:          # manual trigger from GitHub UI
  repository_dispatch:
    types: [trigger-phase1]   # triggered by cron-job.org every weekday at 16:00 IST

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # No explicit timeout — defaults to GitHub-hosted runners' 6h (360-min) hard cap,
    # same as universe_refresh.yml. The 180-min cap killed the run mid-strategy once
    # the universe doubled to ~5,029 (NSE+BSE); rather than chase a number, we let it
    # run as long as it needs. Ingest is now bounded-parallel (--workers 8 in
    # ingest_ohlcv / fetch_bse_only_ohlcv / compute_features), so a normal day is
    # ~30-40m anyway; the 6h ceiling is just a safety net.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Node.js 20 deprecated Jun 2 2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-p1-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-p1-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # yfinance excluded from root requirements.txt (causes malloc crash on Streamlit Cloud).
          # Install it here for the pipeline only.
          pip install "yfinance>=1.3.0"

      # ── Skip check ── reads Drive health report; sets skip=true if Phase 1
      # already ran today (IST). Prevents redundant processing when duplicate
      # cron slots queue up. Bypassed on manual trigger (workflow_dispatch) so
      # you can always force a full rerun from the GitHub UI.
      # Fail-safe: Drive unreachable → skip=false (always proceed).
      - name: Skip check
        id: fresh
        if: github.event_name != 'workflow_dispatch'
        env:
          GDRIVE_FOLDER_ID:        ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_TOKEN_JSON: ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: python scripts/pipeline_skip_check.py --pipeline phase1

      - name: Write credentials from secrets
        if: steps.fresh.outputs.skip != 'true'
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
          SCREENER_SESSION_COOKIE:         ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
            echo "SCREENER_SESSION_COOKIE=$SCREENER_SESSION_COOKIE"
          } > .env

      # ---- Data pull (all best-effort; the health-check is the judge) ----
      - name: Build universe
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/build_universe.py
        continue-on-error: true

      - name: Ingest OHLCV (incremental, NSE)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_ohlcv.py
        continue-on-error: true

      # BSE-only OHLCV — incremental (1mo upsert, same as NSE) into data/ohlcv/
      # so compute_features below covers the full NSE+BSE master_list daily.
      # --live-only: write ONLY the live folder (skip the staging copy) and the
      # folder is pre-listed once — keeps the daily BSE step ~NSE-fast (~20m vs ~2h).
      - name: Ingest OHLCV (incremental, BSE-only)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fetch_bse_only_ohlcv.py --promote --live-only
        continue-on-error: true

      - name: Ingest indices + macro
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_indices_macro.py
        continue-on-error: true

      - name: Fix indices (NSE midcap/smallcap)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/fix_indices_nse.py
        continue-on-error: true

      - name: Ingest FII/DII
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/ingest_fii_dii.py
        continue-on-error: true

      # ---- Features ----
      - name: Compute features
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/compute_features.py
        continue-on-error: true

      # ---- Strategies (each isolated; one failing won't stop the rest) ----
      - name: Strategy - Momentum
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_momentum.py
        continue-on-error: true

      - name: Strategy - MA respect
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_ma_respect.py
        continue-on-error: true

      - name: Strategy - Qullamaggie
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_qullamaggie.py
        continue-on-error: true

      - name: Strategy - Minervini
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_minervini.py
        continue-on-error: true

      - name: Strategy - Darvas
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_darvas.py
        continue-on-error: true

      - name: Strategy - Volume
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_volume.py
        continue-on-error: true

      # ---- Fundamentals-dependent strategies ----
      # Fundamentals + market cap ingestion moved to its own weekly workflow
      # (fundamentals.yml): the full-universe Screener pull + statement history
      # takes hours and no longer fits the daily 180-min budget. The strategies
      # below read the summary.parquet that fundamentals.yml keeps fresh.
      - name: Strategy - CANSLIM
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_canslim.py
        continue-on-error: true

      - name: Strategy - PEAD
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/strategy_pead.py
        continue-on-error: true

      # ---- Aggregate + market state ----
      - name: Aggregate signals
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/aggregate_signals.py
        continue-on-error: true

      - name: Market state
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/market_state.py
        continue-on-error: true

      # ---- Truth gate: the ONLY step allowed to fail the run ----
      - name: Health check (truth gate)
        if: steps.fresh.outputs.skip != 'true'
        run: python scripts/pipeline_healthcheck.py

      # ── Phase 2 backup trigger (Layer 2 reliability) ──────────────────────
      # GitHub Actions scheduled jobs can be delayed 30-90 min or skipped.
      # This step fires Phase 2 via workflow_dispatch after every Phase 1 run,
      # guaranteeing at least one Phase 2 execution per business day.
      #
      # Requires: ACTIONS_PAT secret (GitHub PAT with 'workflow' scope).
      # One-time setup:
      #   1. GitHub → Settings → Developer settings → Personal access tokens (classic)
      #   2. Generate token with 'workflow' scope. Copy it.
      #   3. Repo → Settings → Secrets → Actions → New secret
      #      Name: ACTIONS_PAT   Value: <your token>
      #
      # Safe if secret not yet set: the step logs a message and exits 0.
      - name: Trigger Phase 2 (backup)
        if: always()
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh workflow run phase2.yml --ref main \
              && echo "Phase 2 backup trigger dispatched." \
              || echo "Phase 2 backup trigger failed (will rely on scheduled crons)."
          else
            echo "ACTIONS_PAT not set — Phase 2 backup trigger skipped."
            echo "See daily.yml comment for one-time setup instructions."
          fi
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
