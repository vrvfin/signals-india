name: Darvas box gallery (after Phase 1)

# Draws the Darvas box staircase on a 1-year chart for the TOP 10% of the liquid
# universe by 12-month return, as ONE html page:
#   Drive company_repo/_daily/darvas_gallery.html   (~2.5 MB, overwritten daily)
#
# Runs right after Phase 1 ("Daily Pipeline Execution") finishes successfully.
# Reads Phase 1's Drive prices + market cap only — fetches nothing from source,
# writes nothing any other pipeline reads. Own concurrency group + own cache.
# Plan: .claude/plans/darvas-gallery.md

on:
  workflow_run:
    workflows: ["Daily Pipeline Execution"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: darvas-gallery
  cancel-in-progress: false

jobs:
  build:
    # after Phase 1 only when it succeeded; always on manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120   # first run (empty cache) downloads ~3,300 files: 62 min locally
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # full pipeline requirements (guru CI lesson: _extractor_base imports
      # google.genai at import time even when no LLM is used)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # price cache between runs so only files Phase 1 changed are re-downloaded
      # (own key — never shares the guru screen's or pattern scan's cache)
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            guru/data/live_ohlcv
            guru/data/_live_sync_stamps.parquet
          key: darvas-${{ github.run_id }}
          restore-keys: |
            darvas-

      - name: Write credentials from secrets
        env:
          GDRIVE_FOLDER_ID:                ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET_JSON }}
          GDRIVE_OAUTH_TOKEN_JSON:         ${{ secrets.GDRIVE_OAUTH_TOKEN_JSON }}
        run: |
          mkdir -p _sec
          printf '%s' "$GDRIVE_OAUTH_CLIENT_SECRET_JSON" > _sec/cs.json
          printf '%s' "$GDRIVE_OAUTH_TOKEN_JSON"        > _sec/tk.json
          {
            echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID"
            echo "GDRIVE_OAUTH_CLIENT_SECRET_PATH=$PWD/_sec/cs.json"
            echo "GDRIVE_OAUTH_TOKEN_PATH=$PWD/_sec/tk.json"
          } > .env

      - name: Market cap from Phase 1 (Drive, read-only)
        run: python guru/sync_from_drive.py --light

      - name: Build + publish gallery
        run: python guru/darvas/darvas_gallery.py --sync

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darvas-gallery-${{ github.run_number }}
          path: guru/darvas/darvas_gallery.html
          retention-days: 14
          if-no-files-found: warn
